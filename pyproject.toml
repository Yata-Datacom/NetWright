[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netwright"
version = "3.8.4"
description = "NetWright — 独立的网络工程师工作台：设备清单 / 一键资产盘点 / 意图控制器 / SSH 批量巡检 / 配置生成（116 模板）/ 环路与漂移告警 / 趋势图"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yata-Datacom" }]
dependencies = ["paramiko>=3.4"]

[project.urls]
Homepage = "https://github.com/Yata-Datacom/NetWright"
Changelog = "https://github.com/Yata-Datacom/NetWright/blob/main/CHANGELOG.md"

[project.scripts]
netwright = "netwright.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # 测试先插 sys.path 再 import
