[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netforge"
version = "2.0.0"
description = "NetForge — vendor-neutral network engineer workbench (subnet calc, port scan, alive sweep, CLI cheat sheet, tool launcher)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yata-Datacom" }]
dependencies = ["paramiko>=3.4"]

[project.scripts]
netforge = "netforge:main"

[tool.setuptools]
py-modules = ["netforge"]
packages = ["netforge_lib"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # 测试先插 sys.path 再 import
