[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netforge"
version = "1.0.0"
description = "NetForge — vendor-neutral network engineer workbench (subnet calc, port scan, alive sweep, CLI cheat sheet, tool launcher)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yata-Datacom" }]
dependencies = []

[project.scripts]
netforge = "netforge:main"

[tool.setuptools]
py-modules = ["netforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
