[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netwright"
version = "3.9.0"
description = "NetWright — 网络工程师工作台 + SDN 控制器控制台：拓扑/意图策略/南向适配/事件总线/REST v2"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yata-Datacom" }]
dependencies = ["paramiko>=3.4"]

[project.urls]
Homepage = "https://github.com/Yata-Datacom/NetWright"
Changelog = "https://github.com/Yata-Datacom/NetWright/blob/main/CHANGELOG.md"

[project.scripts]
netwright = "netwright.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]   # 测试先插 sys.path 再 import
