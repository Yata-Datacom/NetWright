name: Build EXE

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: pip install paramiko pyinstaller pillow

      - name: 版本一致性检查（tag 必须等于包版本）
        shell: pwsh
        run: |
          $version = (Select-String -Path src/netwright/__init__.py -Pattern '__version__ = "([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "package version: $version"
          if ("${{ github.ref_name }}" -like "v*") {
            if ("v$version" -ne "${{ github.ref_name }}") {
              throw "tag ${{ github.ref_name }} 与包版本 v$version 不一致"
            }
          }

      - name: Build icon (idempotent)
        run: python tools/make_icon.py

      - name: Build single-file exe
        run: pyinstaller NetWright.spec --noconfirm

      - name: Smoke check exe exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist/NetWright.exe)) { throw "dist/NetWright.exe 未生成" }
          Get-Item dist/NetWright.exe | Select-Object Name, Length

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/NetWright.exe -Algorithm SHA256).Hash
          "SHA256: $hash" | Tee-Object -FilePath dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: NetWright-windows
          path: |
            dist/NetWright.exe
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NetWright.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 安装
            下载 `NetWright.exe` 双击运行，无需 Python；数据文件生成在同目录。

            ## 校验
            见 `SHA256SUMS.txt`（Windows：`Get-FileHash .\NetWright.exe -Algorithm SHA256`）。

            完整变更见 [CHANGELOG.md](https://github.com/Yata-Datacom/NetWright/blob/main/CHANGELOG.md)。
