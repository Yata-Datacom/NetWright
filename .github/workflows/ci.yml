name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install paramiko pytest ruff
      - name: Lint (ruff, core rules)
        run: ruff check --select E4,E7,E9,F src tests main.py
      - name: Tests (GUI 冒烟在无显示环境自动跳过)
        run: pytest tests/ -v -o faulthandler_timeout=60
