name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install paramiko pytest ruff pillow

      - name: Lint (ruff, core rules)
        run: ruff check src tests main.py tools

      - name: Smoke import (catch syntax/import errors fast)
        run: python -c "import sys; sys.path.insert(0, 'src'); import netwright, netwright.app, netwright.sdn, netwright.pages"

      - name: Tests (GUI 冒烟在无显示环境自动跳过)
        run: pytest tests/ -v -o faulthandler_timeout=60

  docs:
    name: README / 文档体检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: README 必须是可读的普通 Markdown（防止再做坏）
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path("README.md").read_text(encoding="utf-8")
          assert len(text) < 120_000, f"README 体积异常：{len(text)} 字符"
          # 允许两种合规开头：直接一级标题，或居中的 HTML 容器（<div align="center"> 内含一级标题）
          head = text.lstrip()
          assert head.startswith("# ") or head.startswith("<div") or head.startswith("<h1"), \
              "README 应以一级标题或居中 HTML 容器开头"
          assert "\n# " in text or text.lstrip().startswith("# "), "README 缺少一级标题"
          longest = max(len(line) for line in text.splitlines())
          assert longest < 2000, f"单行过长（{longest}），疑似粘贴事故"
          print(f"README OK：{len(text)} 字符 / {len(text.splitlines())} 行 / 最长行 {longest}")
          PY
      - name: 文档与版本一致性
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          version = re.search(r'__version__ = "([^"]+)"',
                              Path("src/netwright/__init__.py").read_text(encoding="utf-8")).group(1)
          pyproject = Path("pyproject.toml").read_text(encoding="utf-8")
          assert f'version = "{version}"' in pyproject, "pyproject 与 __init__ 版本不一致"
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          assert f"## [{version}]" in changelog, f"CHANGELOG 缺少 {version} 条目"
          print(f"版本一致：{version}")
          PY

  docs-consistency:
    name: 文档与版本一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # 本 job 不装任何第三方依赖，故不启用 pip 缓存：
          # 空 requirements.txt 下 setup-python 的缓存后置步骤会以失败退出（Post Run … failure），
          # 把一个本来全绿的 job 拖成红。纯文档检查不需要缓存。

      - name: 版本三处一致
        run: python tools/check_version.py

      - name: Markdown 死链检查
        run: python tools/check_links.py

      - name: README 体积守卫（防止再次出现超大文件）
        run: python tools/check_readme.py
