! ============================================================
! NADT 内置模板 — 思科 分支路由器（IOS，NAT 上网）
! 场景：WAN 静态地址 + PAT 上网 + OSPF/默认路由 + LAN DHCP
! 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
! 模板变量：
!   wan_ip / wan_mask / wan_gateway   WAN 口静态地址与 ISP 网关
!   lan_network / lan_mask            LAN 网段（PAT 兴趣流 + DHCP 池）
!   dns_server                        DNS 服务器
!   ospf_router_id / ospf_area        OSPF 参数
!   admin_password                    enable/本地账号密码（建议作为项目凭据）
! ============================================================
!
hostname {{hostname}}
!
! ---- WAN / LAN ----
interface GigabitEthernet0/0
 description TO-ISP
 ip address {{wan_ip}} {{wan_mask}}
 ip nat outside
 no shutdown
!
interface GigabitEthernet0/1
 description TO-LAN
 ip address {{gateway}} {{lan_mask}}
 ip nat inside
 no shutdown
!
! ---- PAT 上网 ----
access-list 20 permit {{lan_network}} 0.0.0.255
ip nat inside source list 20 interface GigabitEthernet0/0 overload
!
! ---- 路由 ----
ip route 0.0.0.0 0.0.0.0 {{wan_gateway}}
!
router ospf 1
 router-id {{ospf_router_id}}
 default-information originate
 network {{gateway}} 0.0.0.0 area {{ospf_area}}
 network {{lan_network}} 0.0.0.255 area {{ospf_area}}
!
! ---- LAN DHCP ----
ip dhcp excluded-address {{gateway}}
ip dhcp pool LAN
 network {{lan_network}} {{lan_mask}}
 default-router {{gateway}}
 dns-server {{dns_server}}
!
! ---- 管理基线 ----
enable secret {{admin_password}}
crypto key generate rsa modulus 2048
ip ssh version 2
aaa new-model
aaa authentication login default local
aaa authorization exec default local
username admin secret {{admin_password}}
line vty 0 4
 transport input ssh
 login local
no ip http server
!
logging host {{gateway}}
ntp server {{gateway}}
!
end
