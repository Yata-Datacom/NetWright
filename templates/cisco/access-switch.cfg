! ============================================================
! NADT 内置模板 — 思科 接入交换机（IOS，二层）
! 场景：VLAN + Trunk 上行 + access 口批量配置 + SSH/AAA 管理基线
! 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway / access_vlan
! 模板变量：
!   uplink_vlans    Trunk 放行 VLAN，如 10,20,30
!   domain_name     域名（SSH key 生成用）
!   admin_password  enable 密码（建议作为项目凭据）
! ============================================================
!
hostname {{hostname}}
!
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan {{mgmt_vlan}}
 name MGMT
!
! ---- 管理 SVI ----
interface Vlan{{mgmt_vlan}}
 ip address {{mgmt_ip}} {{mask}}
 no shutdown
!
ip default-gateway {{gateway}}
!
! ---- 上行 Trunk ----
interface GigabitEthernet0/1
 description UPLINK
 switchport mode trunk
 switchport trunk allowed vlan {{uplink_vlans}}
!
! ---- 接入口（批量 range，按现场调整范围）----
interface range FastEthernet0/1 - 24
 switchport mode access
 switchport access vlan {{access_vlan}}
 spanning-tree portfast
 spanning-tree bpduguard enable
!
! ---- 管理基线 ----
enable secret {{admin_password}}
!
ip domain-name {{domain_name}}
crypto key generate rsa modulus 2048
ip ssh version 2
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
!
username admin secret {{admin_password}}
!
line vty 0 4
 transport input ssh
 login local
 exec-timeout 10 0
line vty 5 15
 transport input ssh
 login local
!
no ip http server
!
spanning-tree mode rapid-pvst
!
! syslog / NTP
logging host {{gateway}}
ntp server {{gateway}}
!
end
