! ============================================================
! NADT 内置模板 — 思科 核心交换机（IOS，三层）
! 场景：SVI 网关 + HSRP 双机 + EtherChannel 互联 + OSPF
! 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
! 模板变量：
!   ospf_router_id / ospf_area   OSPF 参数
!   hsrp_priority                HSRP 优先级（主 110 / 备 100）
!   hsrp_vip                     HSRP 虚拟网关地址
!   uplink_vlans                 Trunk 放行 VLAN，如 10,20,30
!   admin_password               enable 密码（建议作为项目凭据）
! ============================================================
!
hostname {{hostname}}
!
vlan 10
 name USERS
vlan 20
 name SERVERS
vlan {{mgmt_vlan}}
 name MGMT
!
ip routing
!
! ---- 上行/下联 EtherChannel ----
interface Port-channel1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan {{uplink_vlans}}
!
interface range TenGigabitEthernet1/0/1 - 2
 channel-group 1 mode active
!
! ---- 管理 SVI ----
interface Vlan{{mgmt_vlan}}
 ip address {{mgmt_ip}} {{mask}}
 no shutdown
!
! ---- 业务网关（HSRP，示例 VLAN10；对端改 priority 对称配置）----
interface Vlan10
 ip address 192.0.2.2 255.255.255.0
 standby 10 ip {{hsrp_vip}}
 standby 10 priority {{hsrp_priority}}
 standby 10 preempt
 no shutdown
!
! ---- OSPF ----
router ospf 1
 router-id {{ospf_router_id}}
 network {{mgmt_ip}} 0.0.0.0 area {{ospf_area}}
 network 192.0.2.0 0.0.0.255 area {{ospf_area}}
!
! ---- 管理基线 ----
enable secret {{admin_password}}
crypto key generate rsa modulus 2048
ip ssh version 2
aaa new-model
aaa authentication login default local
aaa authorization exec default local
username admin secret {{admin_password}}
line vty 0 4
 transport input ssh
 login local
no ip http server
!
spanning-tree mode rapid-pvst
!
logging host {{gateway}}
ntp server {{gateway}}
!
end
