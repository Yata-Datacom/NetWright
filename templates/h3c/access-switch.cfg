# ============================================================
# NADT 内置模板 — 新华三 接入交换机（Comware V7，二层）
# 场景：VLAN + Bridge-Aggregation 上行 + access 口 + SSH/AAA 基线
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway / access_vlan
# 模板变量：
#   uplink_vlans    上行 Trunk 放行 VLAN，如 "10 20 30"
#   core_password   本地管理账号密码（建议作为项目凭据）
# ============================================================
#
sysname {{hostname}}
#
vlan 10
vlan 20
vlan {{mgmt_vlan}}
#
# ---- 上行 Bridge-Aggregation（LACP 动态聚合）----
interface Bridge-Aggregation1
 link-aggregation mode dynamic
 port link-type trunk
 port trunk permit vlan 1 {{uplink_vlans}}
#
interface Ten-GigabitEthernet1/0/49
 port link-aggregation group 1
interface Ten-GigabitEthernet1/0/50
 port link-aggregation group 1
#
# ---- 管理 VLAN 接口 ----
interface Vlan-interface{{mgmt_vlan}}
 ip address {{mgmt_ip}} {{mask}}
#
ip route-static 0.0.0.0 0.0.0.0 {{gateway}}
#
# ---- 接入口（批量 range）----
interface range GigabitEthernet1/0/1 to GigabitEthernet1/0/44
 port link-type access
 port access vlan {{access_vlan}}
 stp edged-port
#
# ---- 管理基线（SSH only）----
local-user admin class manage
 password hash {{core_password}}
 service-type ssh
 authorization-attribute user-role network-admin
#
line vty 0 4
 authentication-mode scheme
 protocol inbound ssh
 user-role network-operator
#
ssh server enable
ssh user admin service-type stelnet authentication-type password
#
stp mode mstp
#
info-center loghost {{gateway}}
#
return
