# ============================================================
# NADT 内置模板 — 新华三 核心交换机（Comware V7，三层）
# 场景：Vlan-interface 网关 + VRRP + Bridge-Aggregation 互联 + OSPF + DHCP 中继
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
# 模板变量：
#   ospf_router_id / ospf_area      OSPF 参数
#   vrrp_priority                   VRRP 优先级（主 120 / 备 90）
#   uplink_vlans                    互联 Trunk 放行 VLAN，如 "10 20 30"
#   core_password                   本地管理账号密码（建议作为项目凭据）
# ============================================================
#
sysname {{hostname}}
#
vlan 10
vlan 20
vlan {{mgmt_vlan}}
#
ip routing
#
# ---- 互联/上行 Bridge-Aggregation ----
interface Bridge-Aggregation1
 link-aggregation mode dynamic
 port link-type trunk
 port trunk permit vlan 1 {{uplink_vlans}}
#
interface Ten-GigabitEthernet1/0/49
 port link-aggregation group 1
interface Ten-GigabitEthernet1/0/50
 port link-aggregation group 1
#
# ---- 管理网关（VRRP，对端改 priority 对称配置）----
interface Vlan-interface{{mgmt_vlan}}
 ip address {{mgmt_ip}} {{mask}}
 vrrp vrid 11 virtual-ip {{gateway}}
 vrrp vrid 11 priority {{vrrp_priority}}
#
# ---- 业务网关（示例 VLAN10）----
interface Vlan-interface10
 ip address 192.0.2.1 255.255.255.0
 vrrp vrid 10 virtual-ip 192.0.2.254
 vrrp vrid 10 priority {{vrrp_priority}}
#
# ---- OSPF ----
ospf 1 router-id {{ospf_router_id}}
 area {{ospf_area}}
  network {{mgmt_ip}} 0.0.0.0
  network 192.0.2.0 0.0.0.255
#
# ---- DHCP 中继 ----
interface Vlan-interface10
 dhcp select relay
 dhcp relay server-address 192.0.2.250
#
# ---- 管理基线（SSH only）----
local-user admin class manage
 password hash {{core_password}}
 service-type ssh
 authorization-attribute user-role network-admin
#
line vty 0 4
 authentication-mode scheme
 protocol inbound ssh
 user-role network-admin
#
ssh server enable
ssh user admin service-type stelnet authentication-type password
#
stp mode mstp
stp instance 0 root primary
#
ntp-service unicast-server {{gateway}}
info-center loghost {{gateway}}
#
return
