# ============================================================
# NADT 内置模板 — 华为 分支路由器（AR 系列，NAT 上网）
# 场景：WAN 静态地址 + easy-IP NAT 上网 + OSPF/默认路由 + LAN DHCP
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
# 模板变量：
#   wan_ip / wan_mask / wan_gateway  WAN 口静态地址与运营商网关
#   lan_network / lan_mask           LAN 网段（DHCP 地址池）
#   dns_server                       DNS 服务器
#   ospf_router_id / ospf_area       OSPF 参数（上联城域网时用）
#   core_password                    本地管理账号密码（建议作为项目凭据）
# ============================================================
#
sysname {{hostname}}
#
# ---- WAN 口（静态地址）----
interface GigabitEthernet0/0/0
 description TO-ISP
 ip address {{wan_ip}} {{wan_mask}}
#
# ---- LAN 口（接核心/交换机）----
interface GigabitEthernet0/0/1
 description TO-LAN
 ip address {{gateway}} {{lan_mask}}
#
# ---- NAT：内网网段从 WAN 口出（easy-IP 复用公网地址）----
acl 2000
 rule 5 permit source {{lan_network}} {{lan_mask}}
#
interface GigabitEthernet0/0/0
 nat outbound 2000
#
# ---- 默认路由指 ISP，OSPF 收内网路由 ----
ip route-static 0.0.0.0 0.0.0.0 {{wan_gateway}}
#
ospf 1 router-id {{ospf_router_id}}
 default-route-advertise
 area {{ospf_area}}
  network {{gateway}} 0.0.0.0
  network {{lan_network}} 0.0.0.255
#
# ---- LAN DHCP ----
dhcp enable
ip pool LAN
 gateway-list {{gateway}}
 network {{lan_network}} mask {{lan_mask}}
 dns-list {{dns_server}}
#
interface GigabitEthernet0/0/1
 dhcp select global
#
# ---- 管理基线（SSH only）----
aaa
 local-user admin password irreversible-cipher {{core_password}}
 local-user admin privilege level 15
 local-user admin service-type ssh
#
stelnet server enable
ssh server-source all-interface
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh
#
undo icmp name timestamp-request receive
#
# 服务器发布示例（按需取消注释改地址）
# interface GigabitEthernet0/0/0
#  nat server protocol tcp global current-interface www inside {{lan_network}}1 www
#
return
