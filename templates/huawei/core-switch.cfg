# ============================================================
# NADT 内置模板 — 华为 核心/汇聚交换机（CE / S 系列，三层）
# 场景：VLANIF 三层网关 + VRRP 双机 + Eth-Trunk 互联 + OSPF + DHCP 中继
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
# 模板变量：
#   ospf_router_id  OSPF Router-ID（建议用 Loopback 地址）
#   ospf_area       OSPF 区域号，如 0.0.0.0
#   uplink_vlans    上行/互联 Trunk 放行 VLAN，如 "10 20 30"
#   vrrp_priority   本机 VRRP 优先级（主 120 / 备 90，对端填另一个值）
#   dhcp_server     DHCP 服务器地址（业务网段中继指向）
#   core_password   本地管理账号密码（建议作为项目凭据）
# ============================================================
#
sysname {{hostname}}
#
vlan batch 10 20 30 40 {{mgmt_vlan}}
#
stp enable
stp mode mstp
stp instance 0 root primary
#
lldp enable
#
dhcp enable
#
# ---- 管理网关（VRRP VRID 11，对端设备改 priority 后对称配置）----
interface Vlanif {{mgmt_vlan}}
 ip address {{mgmt_ip}} {{mask}}
 vrrp vrid 11 virtual-ip {{gateway}}
 vrrp vrid 11 priority {{vrrp_priority}}
#
# ---- 业务网关（示例 VLAN10/20，按需复制修改）----
interface Vlanif10
 ip address 192.0.2.1 255.255.255.0
 vrrp vrid 10 virtual-ip 192.0.2.254
 vrrp vrid 10 priority {{vrrp_priority}}
#
interface Vlanif20
 ip address 198.51.100.1 255.255.255.0
 vrrp vrid 20 virtual-ip 198.51.100.254
 vrrp vrid 20 priority {{vrrp_priority}}
#
# ---- 上下行互联 Eth-Trunk ----
interface Eth-Trunk1
 port link-type trunk
 undo port trunk allow-pass vlan 1
 port trunk allow-pass vlan {{uplink_vlans}}
#
# ---- OSPF ----
ospf 1 router-id {{ospf_router_id}}
 area {{ospf_area}}
  network {{mgmt_ip}} 0.0.0.0
  network 192.0.2.0 0.0.0.255
  network 198.51.100.0 0.0.0.255
#
# ---- DHCP 中继（业务网段指向 DHCP 服务器）----
interface Vlanif10
 dhcp select relay
 dhcp relay server-ip {{dhcp_server}}
#
# ---- 安全管理基线 ----
aaa
 local-user admin password irreversible-cipher {{core_password}}
 local-user admin privilege level 15
 local-user admin service-type ssh
#
stelnet server enable
ssh server-source all-interface
ssh client first-time enable
ssh server cipher aes256_ctr
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh
#
undo icmp name timestamp-request receive
#
ntp-service unicast-server {{gateway}}
#
lldp management-address {{mgmt_ip}}
#
# 浮动默认路由（回程兜底，优先级低于 OSPF）
ip route-static 0.0.0.0 0.0.0.0 {{gateway}} preference 200
#
return
