# ============================================================
# NADT 内置模板 — 华为 堆叠接入交换机（CSS / iStack）
# 场景：两台盒式堆叠成一台，双上行跨设备 Eth-Trunk（M-LAG 效果）
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway / access_vlan
# 模板变量：
#   stack_member    本机堆叠成员号（1 或 2，另一台填不同值）
#   stack_priority  堆叠优先级（主控 200 / 备 100）
#   uplink_vlans    上行 Trunk 放行 VLAN，如 "10 20 30"
# 说明：堆叠口配置需在接线前完成（先配后连线防环路）；
#       堆叠后两台设备配置自动合并，只需在主控上下发本配置。
# ============================================================
#
sysname {{hostname}}
#
vlan batch 10 20 30 {{mgmt_vlan}}
#
# ---- 堆叠口（member 按 stack_member 生成）----
stack
 stack member {{stack_member}} priority {{stack_priority}}
#
interface Stack-Port {{stack_member}}/1
 port member-group interface GigabitEthernet 0/0/47 to 0/0/48
#
# ---- 双活检测（直连 MAD，防脑裂）----
interface GigabitEthernet 0/0/10
 mad detect mode direct
#
# ---- 上行跨设备 Eth-Trunk（堆叠后两台各出两条链路）----
interface Eth-Trunk1
 port link-type trunk
 undo port trunk allow-pass vlan 1
 port trunk allow-pass vlan {{uplink_vlans}}
#
interface XGigabitEthernet 0/0/1
 eth-trunk 1
interface XGigabitEthernet 1/0/1
 eth-trunk 1
#
# ---- 管理 VLANIF（堆叠系统统一管理地址）----
interface Vlanif {{mgmt_vlan}}
 ip address {{mgmt_ip}} {{mask}}
#
# ---- 接入口（堆叠后端口编号为 成员号/槽位/口，示例成员1）----
interface GigabitEthernet 0/0/1
 port link-type access
 port default vlan {{access_vlan}}
 stp edged-port enable
#
interface GigabitEthernet 0/0/2
 port link-type access
 port default vlan {{access_vlan}}
 stp edged-port enable
#
interface GigabitEthernet 0/0/3
 port link-type access
 port default vlan {{access_vlan}}
 stp edged-port enable
#
interface GigabitEthernet 0/0/4
 port link-type access
 port default vlan {{access_vlan}}
 stp edged-port enable
#
# ---- 管理基线 ----
stelnet server enable
ssh server-source all-interface
ssh client first-time enable
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh
#
ip route-static 0.0.0.0 0.0.0.0 {{gateway}}
#
lldp enable
lldp management-address {{mgmt_ip}}
#
return
