# ============================================================
# NetForge 内置模板 — 流量采集（NetStream / NetFlow / sFlow） · 思科 IOS-XE/NX-OS
# 场景: 把五元组流量统计导出到采集器，用于流量分析与审计。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
! ---- Flexible NetFlow ----
flow record REC1
 match ipv4 source address
 match ipv4 destination address
 match transport source-port
 match transport destination-port
 match ipv4 protocol
 collect counter bytes long
 collect counter packets long
 collect timestamp absolute first

flow exporter EXP1
 destination 10.0.0.50
 source Loopback0
 transport udp 9995
 template data timeout 60

flow monitor MON1
 record REC1
 exporter EXP1
 cache timeout active 60

interface GigabitEthernet0/0
 ip flow monitor MON1 input
 ip flow monitor MON1 output
