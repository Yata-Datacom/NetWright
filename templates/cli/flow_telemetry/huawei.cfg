# ============================================================
# NetForge 内置模板 — 流量采集（NetStream / NetFlow / sFlow） · 华为 VRP
# 场景: 把五元组流量统计导出到采集器，用于流量分析与审计。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- NetStream 采样 ----
interface GigabitEthernet0/0/0
 ip netstream inbound
 ip netstream outbound
 ip netstream sampler fix-packets 1000 inbound

# ---- 版本与导出 ----
ip netstream export version 9
ip netstream export source ip 1.1.1.1
ip netstream export host 10.0.0.50 9995
ip netstream timeout active 1

# ---- 查看 ----
# display netstream statistics
