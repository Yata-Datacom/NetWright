# ============================================================
# NetForge 内置模板 — 流量采集（NetStream / NetFlow / sFlow） · 新华三 Comware
# 场景: 把五元组流量统计导出到采集器，用于流量分析与审计。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
interface GigabitEthernet1/0/0
 ip netstream inbound
 ip netstream outbound

netstream export version 9
netstream export source ip 1.1.1.1
netstream export host 10.0.0.50 9995
ip netstream timeout active 1
