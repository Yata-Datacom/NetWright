# ============================================================
# NetForge 内置模板 — 组播（IGMP / PIM-SM / IGMP Snooping） · 华为 VRP
# 场景: IPTV/监控场景：三层 PIM-SM + 静态 RP，二层 VLAN 开 IGMP Snooping 防泛洪。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- 三层：全局与接口 ----
multicast routing-enable

interface Vlanif10
 pim sm
 igmp enable

# ---- 静态 RP（全网一致）----
pim
 static rp 10.1.1.100 range 239.0.0.0 255.0.0.0

# ---- 二层：VLAN 内 IGMP Snooping ----
igmp-snooping enable
vlan 10
 igmp-snooping enable
 igmp-snooping querier enable         # 二层无三层时开启查询器

# ---- 查看 ----
# display pim neighbor
# display igmp group
