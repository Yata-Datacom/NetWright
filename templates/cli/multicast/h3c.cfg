# ============================================================
# NetForge 内置模板 — 组播（IGMP / PIM-SM / IGMP Snooping） · 新华三 Comware
# 场景: IPTV/监控场景：三层 PIM-SM + 静态 RP，二层 VLAN 开 IGMP Snooping 防泛洪。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
multicast routing

interface Vlan-interface10
 pim sm
 igmp enable

pim
 static-rp 10.1.1.100 range 239.0.0.0 255.0.0.0

# ---- 二层 ----
igmp-snooping
vlan 10
 igmp-snooping enable
 igmp-snooping general-query source-ip 10.0.0.1
