# ============================================================
# NetForge 内置模板 — 组播（IGMP / PIM-SM / IGMP Snooping） · 思科 IOS-XE/NX-OS
# 场景: IPTV/监控场景：三层 PIM-SM + 静态 RP，二层 VLAN 开 IGMP Snooping 防泛洪。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
ip multicast-routing

interface Vlan10
 ip pim sparse-mode
 ip igmp version 3

! ---- 静态 RP ----
ip pim rp-address 10.1.1.100 239.0.0.0 255.0.0.0

! ---- 二层 IGMP Snooping ----
ip igmp snooping vlan 10
ip igmp snooping vlan 10 querier 10.0.0.1

! ---- 查看 ----
! show ip pim neighbor
! show ip igmp groups
