# ============================================================
# NetForge 内置模板 — MPLS L3VPN（PE-CE，VPN 实例 + MP-BGP） · 思科 IOS-XE/NX-OS
# 场景: 运营商/大网专线：PE 上创建 VRF、绑接口、MP-BGP VPNv4 传路由、PE-CE 用 OSPF/BGP 对接。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
! ---- MPLS 与 LDP ----
mpls ldp router-id Loopback0
interface GigabitEthernet0/1
 mpls ip

! ---- VRF 定义 ----
vrf definition CUSTOMER-A
 rd 65000:100
 address-family ipv4
  route-target export 100:100
  route-target import 100:100

! ---- 接口绑定 ----
interface GigabitEthernet0/2
 vrf forwarding CUSTOMER-A
 ip address 192.168.100.1 255.255.255.252

! ---- PE-CE OSPF ----
router ospf 100 vrf CUSTOMER-A
 network 192.168.100.0 0.0.0.3 area 0

! ---- MP-BGP VPNv4 ----
router bgp 65000
 neighbor 2.2.2.2 remote-as 65000
 neighbor 2.2.2.2 update-source Loopback0
 address-family vpnv4
  neighbor 2.2.2.2 activate
  neighbor 2.2.2.2 send-community extended

! ---- OSPF 路由重分发进 VPN ----
router ospf 100 vrf CUSTOMER-A
 redistribute bgp 65000 subnets
