# ============================================================
# NetForge 内置模板 — MPLS L3VPN（PE-CE，VPN 实例 + MP-BGP） · 华为 VRP
# 场景: 运营商/大网专线：PE 上创建 VRF、绑接口、MP-BGP VPNv4 传路由、PE-CE 用 OSPF/BGP 对接。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- 使能 MPLS 与 LDP ----
mpls lsr-id 1.1.1.1
mpls
mpls ldp

# ---- VPN 实例 ----
ip vpn-instance CUSTOMER-A
 ipv4-family
  route-distinguisher 65000:100
  vpn-target 100:100 export-extcommunity
  vpn-target 100:100 import-extcommunity

# ---- 接口绑定实例（PE-CE）----
interface GigabitEthernet0/0/1
 ip binding vpn-instance CUSTOMER-A
 ip address 192.168.100.1 255.255.255.252

# ---- PE-CE 路由（实例内 OSPF）----
ospf 100 vpn-instance CUSTOMER-A
 area 0
  network 192.168.100.0 0.0.0.3

# ---- 骨干 MP-BGP VPNv4 ----
bgp 65000
 router-id 1.1.1.1
 peer 2.2.2.2 as-number 65000
 peer 2.2.2.2 connect-interface LoopBack0
 ipv4-family vpnv4
  policy vpn-target
  peer 2.2.2.2 enable
