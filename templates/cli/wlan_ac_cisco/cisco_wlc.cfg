! ============================================================
! NetForge 内置模板 — 无线 WLC 开局（思科 Catalyst 9800，IOS-XE 17.x）
! 场景：WLAN（SSID）→ Policy Profile（VLAN/安全）→ AP Join Profile → Tag
! 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
! 模板变量：
!   service_vlan / ssid / wifi_password / ap_group
! ============================================================
!
hostname {{hostname}}
!
! ---- 管理与 AP 上线 VLAN ----
vlan {{mgmt_vlan}}
vlan {{service_vlan}}
interface Vlan{{mgmt_vlan}}
 ip address {{mgmt_ip}} {{mask}}
 no shutdown
!
wireless management interface Vlan{{mgmt_vlan}}
!
! ---- ① WLAN（SSID + 安全）----
wlan WLAN-1 1 {{ssid}}
 ssid {{ssid}}
 security wpa psk set-key ascii 0 {{wifi_password}}
 no shutdown
!
! ---- ② Policy Profile（转发 VLAN）----
wireless profile policy POL-1
 vlan {{service_vlan}}
 no shutdown
!
! ---- ③ AP Join Profile（CAPWAP 参数，默认即可）----
wireless profile join default-join-profile
!
! ---- ④ Site Tag（绑定 policy + join）----
wireless tag site SITE-1
 description {{ap_group}}
 policy-profile POL-1
!
! ---- AP 登记（MAC）----
ap mac-address xxxx.xxxx.xxxx
 site-tag SITE-1
!
! ---- 查看 ----
! show ap summary
! show wlan summary
! show client summary
!
end
