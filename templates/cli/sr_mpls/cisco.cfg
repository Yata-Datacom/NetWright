! ============================================================
! NetForge 内置模板 — SR-MPLS 骨干（思科 IOS-XR，IS-IS Segment Routing）
! 场景：无控制器手工部署 SR-MPLS：IS-IS + SRGB + Prefix-SID（节点段）
! 注意：以 IOS-XR 7.x 写法为准，老版本命令略有差异。
! 模板变量：
!   ospf_router_id  Loopback0 地址（SR 节点标识）
!   prefix_sid      本节点 Prefix-SID 索引（如 1 / 2 / 3）
! 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
! ============================================================
!
hostname {{hostname}}
!
interface LoopBack0
 ipv4 address {{ospf_router_id}} 255.255.255.255
!
interface GigabitEthernet0/0/0/0
 ipv4 address {{mgmt_ip}} {{mask}}
!
router isis 1
 is-type level-2-only
 net 49.0001.0000.0000.{{prefix_sid}}.00
 address-family ipv4 unicast
  metric-style wide
  segment-routing mpls
 !
 interface LoopBack0
  passive
  address-family ipv4 unicast
   prefix-sid index {{prefix_sid}}
  !
 !
 interface GigabitEthernet0/0/0/0
  point-to-point
  address-family ipv4 unicast
  !
 !
!
mpls oam
!
segment-routing
 global-block 16000 23999
!
! ---- 查看 ----
! show segment-routing mpls state
! show isis segment-routing label table
!
end
