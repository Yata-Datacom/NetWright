# ============================================================
# NetForge 内置模板 — SR-MPLS 骨干（华为 NE/CE，IS-IS Segment Routing）
# 场景：无控制器手工部署 SR-MPLS 骨干：IS-IS Level-2 + SRGB + Prefix-SID，
#       提供源路由转发能力（TE/FRR 前置条件）。
# 注意：SR 命令随 VRP 版本差异较大，下发前请对照设备手册核对。
# 模板变量：
#   ospf_router_id  Loopback0 地址（同时是 SR Prefix-SID 节点标识）
#   prefix_sid      本节点 Prefix-SID（建议 = 节点号，如 1 / 2 / 3）
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
# ============================================================
#
sysname {{hostname}}
#
interface LoopBack0
 ip address {{ospf_router_id}} 255.255.255.255
#
# ---- IS-IS Level-2 + SR-MPLS ----
isis 1
 is-level level-2
 cost-style wide
 network-entity 49.0001.0000.0000.{{prefix_sid}}.00
 segment-routing mpls
 segment-routing global-block 16000 23999
#
interface LoopBack0
 isis enable 1
 isis prefix-sid index {{prefix_sid}}
#
interface GigabitEthernet0/0/0
 isis enable 1
#
# ---- 使能 MPLS 转发 ----
mpls lsr-id {{ospf_router_id}}
mpls
#
# ---- TI-LFRA / SRLB（可选，按需启用）----
# isis 1
#  segment-routing srlb 24000 24099
#
# ---- 查看 ----
# display segment-routing prefix mpls forwarding
# display isis route 1 level-2
#
return
