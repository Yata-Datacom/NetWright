! ============================================================
! NetForge 内置模板 — SLAAC + 无状态 DHCPv6（思科 IOS-XE）
! 场景：RA 前缀自配（SLAAC）+ 无状态 DHCPv6 下发 DNS（M=0 O=1）
! 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
! 模板变量：
!   lan_prefix      业务 IPv6 前缀，如 2001:DB8:10::/64
!   v6_gateway      SVI 的 IPv6 地址（本机），如 2001:DB8:10::1/64
!   dns_v6          DNS 服务器地址
!   ospf_router_id / ospf_area   OSPFv3 参数
! ============================================================
!
hostname {{hostname}}
!
ipv6 unicast-routing
ipv6 dhcp pool V6-OPTIONS
 dns-server {{dns_v6}}
 domain-name lab.example
!
interface Vlan{{mgmt_vlan}}
 ipv6 enable
 ipv6 address {{v6_gateway}}
 ipv6 nd prefix {{lan_prefix}} 14400 1800        ! RA 宣告前缀（SLAAC）
 ipv6 nd managed-config-flag                     ! M=0（默认 0，可省略）
 ipv6 nd other-config-flag                       ! O=1：无状态 DHCPv6
 ipv6 dhcp server V6-OPTIONS
 no shutdown
!
ipv6 router ospf 1
 router-id {{ospf_router_id}}
!
interface Vlan{{mgmt_vlan}}
 ipv6 ospf 1 area {{ospf_area}}
!
ipv6 route ::/0 {{gateway}}
!
end
