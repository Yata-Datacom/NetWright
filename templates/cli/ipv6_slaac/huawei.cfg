# ============================================================
# NetForge 内置模板 — IPv6 地址自动配置：SLAAC + 无状态 DHCPv6（华为 VRP）
# 场景：终端通过 RA 前缀自配地址（SLAAC），DNS/域名等参数由无状态 DHCPv6 下发
#       （RA 标志 M=0 O=1 —— 地址自配，其余参数找 DHCPv6 服务器）
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
# 模板变量：
#   lan_prefix      业务 IPv6 前缀，如 2001:DB8:10::/64
#   v6_gateway      VLANIF 的 IPv6 网关地址（本机），如 2001:DB8:10::1/64
#   dns_v6          DNS 服务器（v6 地址，经无状态 DHCPv6 下发）
#   ospf_router_id / ospf_area   OSPFv3 参数
# ============================================================
#
sysname {{hostname}}
#
ipv6
#
# ---- DHCPv6 服务器（无状态：只下发 DNS/域名，不发地址）----
dhcpv6 pool V6-OPTIONS
 dns-server {{dns_v6}}
 domain-name lab.example
#
# ---- 网关接口：RA 宣告前缀（SLAAC）+ O 位 ----
interface Vlanif {{mgmt_vlan}}
 ip address {{mgmt_ip}} {{mask}}
 ipv6 enable
 ipv6 address {{v6_gateway}}
 undo ipv6 nd ra halt
 ipv6 nd autoconfig managed-flag       # 置 0：地址走 SLAAC（此命令为显式关闭 managed）
 undo ipv6 nd autoconfig managed-flag
 ipv6 nd autoconfig other-flag         # O=1：其余参数找 DHCPv6
 dhcpv6 server V6-OPTIONS
#
# ---- 动态路由：OSPFv3 ----
ospfv3 1
 router-id {{ospf_router_id}}
#
interface Vlanif {{mgmt_vlan}}
 ospfv3 1 area {{ospf_area}}
#
# ---- 默认路由（上行）----
ipv6 route-static :: 0 {{gateway}}
#
return
