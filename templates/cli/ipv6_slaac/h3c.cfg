# ============================================================
# NetForge 内置模板 — SLAAC + 无状态 DHCPv6（新华三 Comware V7）
# 场景：RA 前缀自配（SLAAC）+ 无状态 DHCPv6 下发 DNS（M=0 O=1）
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
# 模板变量：
#   lan_prefix      业务 IPv6 前缀，如 2001:DB8:10::/64
#   v6_gateway      VLANIF 的 IPv6 地址（本机），如 2001:DB8:10::1/64
#   dns_v6          DNS 服务器地址
#   ospf_router_id / ospf_area   OSPFv3 参数
# ============================================================
#
sysname {{hostname}}
#
ipv6
#
# ---- 无状态 DHCPv6 选项池 ----
dhcpv6 pool V6-OPTIONS
 dns-server {{dns_v6}}
 domain-name lab.example
#
# ---- 网关接口 ----
interface Vlan-interface{{mgmt_vlan}}
 ipv6 enable
 ipv6 address {{v6_gateway}}
 undo ipv6 nd ra halt
 undo ipv6 nd autoconfig managed-flag   # M=0
 ipv6 nd autoconfig other-flag          # O=1
 dhcpv6 server V6-OPTIONS
#
# ---- OSPFv3 ----
ospfv3 1
 router-id {{ospf_router_id}}
#
interface Vlan-interface{{mgmt_vlan}}
 ospfv3 1 area {{ospf_area}}
#
ipv6 route-static :: 0 {{gateway}}
#
return
