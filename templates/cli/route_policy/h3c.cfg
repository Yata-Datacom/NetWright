# ============================================================
# NetForge 内置模板 — 路由策略工具箱（prefix-list / route-policy / filter-policy） · 新华三 Comware
# 场景: 路由过滤与属性改写：前缀列表、route-policy 各节点写法、在 OSPF/BGP 中的挂载点。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- 前缀列表 ----
ip prefix-list LAN index 10 permit 192.168.0.0 16 greater-equal 24 less-equal 32

# ---- route-policy ----
route-policy IMPORT-OSPF permit node 10
 if-match ip-prefix LAN
 apply cost 100
route-policy IMPORT-OSPF deny node 20

# ---- 挂载点 ----
bgp 65001
 address-family ipv4 unicast
  import-route ospf 1 route-policy IMPORT-OSPF

ospf 1
 filter-policy prefix-list LAN import
