# ============================================================
# NetForge 内置模板 — 路由策略工具箱（prefix-list / route-policy / filter-policy） · 思科 IOS-XE/NX-OS
# 场景: 路由过滤与属性改写：前缀列表、route-policy 各节点写法、在 OSPF/BGP 中的挂载点。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
! ---- 前缀列表 ----
ip prefix-list LAN seq 10 permit 192.168.0.0/16 ge 24 le 32

! ---- route-map ----
route-map IMPORT-OSPF permit 10
 match ip address prefix-list LAN
 set metric 100
route-map IMPORT-OSPF deny 20

! ---- 挂载点：BGP ----
router bgp 65001
 address-family ipv4
  redistribute ospf 1 route-map IMPORT-OSPF

! ---- 挂载点：OSPF（分布列表）----
router ospf 1
 distribute-list prefix LAN in

! ---- 查看 ----
! show ip prefix-list
