# ============================================================
# NetForge 内置模板 — BFD 双向转发检测（与 OSPF/BGP/静态联动） · 思科 IOS-XE/NX-OS
# 场景: 毫秒级故障检测：会话建立、与动态路由协议联动、接口级参数调整。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
! ---- 接口级 BFD 模板 ----
interface GigabitEthernet0/0
 bfd interval 100 min_rx 100 multiplier 3

! ---- 与 OSPF 联动 ----
router ospf 1
 bfd all-interfaces

! ---- 与 BGP 联动 ----
router bgp 65001
 neighbor 10.0.0.2 fall-over bfd

! ---- 与静态路由联动（直连 BFD）----
ip route static bfd GigabitEthernet0/0 10.0.0.2

! ---- 查看 ----
! show bfd neighbors details
