# ============================================================
# NetForge 内置模板 — BFD 双向转发检测（与 OSPF/BGP/静态联动） · 新华三 Comware
# 场景: 毫秒级故障检测：会话建立、与动态路由协议联动、接口级参数调整。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
bfd

# ---- 与 OSPF 联动 ----
ospf 1
 bfd all-interfaces enable

# ---- 与 BGP 联动 ----
bgp 65001
 peer 10.0.0.2 bfd

# ---- 接口参数 ----
interface GigabitEthernet1/0/0
 bfd min-transmit-interval 100
 bfd min-receive-interval 100
 bfd detect-multiplier 3
