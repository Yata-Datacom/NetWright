# ============================================================
# NetForge 内置模板 — BFD 双向转发检测（与 OSPF/BGP/静态联动） · 华为 VRP
# 场景: 毫秒级故障检测：会话建立、与动态路由协议联动、接口级参数调整。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- 独立 BFD 会话（多跳）----
bfd
bfd TO_CORE bind peer-ip 10.0.0.2
 discriminator local 10
 discriminator remote 20
 commit

# ---- 与 OSPF 联动 ----
ospf 1
 bfd all-interfaces enable
 bfd all-interfaces min-tx-interval 100 min-rx-interval 100 detect-multiplier 3

# ---- 与 BGP 联动 ----
bgp 65001
 peer 10.0.0.2 bfd enable

# ---- VRRP 联动 BFD（不依赖接口 up/down）----
# interface Vlanif10
#  vrrp vrid 10 track bfd-session TO_CORE reduced 30
