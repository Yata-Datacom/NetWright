# ============================================================
# NetForge 内置模板 — SONiC 动态路由（FRR BGP，数据中心 spine-leaf 惯例）
# 场景：SONiC 的三层路由由 FRR 承载：vtysh 配置 BGP（含 BGP unnumbered 可选）
# 模板变量：
#   local_as        本端 AS（leaf/spine 各自规划）
#   router_id       Router-ID
#   peer_ip / peer_as   上联 spine 邻居
#   loopback_v6     Loopback IPv6（SRv6/EVPN 场景预留）
# ============================================================
#
# ---- 进入 FRR ----
vtysh
!
configure terminal
!
frr version 8.5
frr defaults traditional
hostname {{hostname}}
!
interface Loopback0
 ip address 10.255.0.1/32
 ipv6 address {{loopback_v6}}/128
!
interface Ethernet48
 ip address {{mgmt_ip}}/{{mask}}
!
router bgp {{local_as}}
 bgp router-id {{router_id}}
 no bgp ebgp-requires-policy
 neighbor {{peer_ip}} remote-as {{peer_as}}
 neighbor {{peer_ip}} capability extended-nexthop
 address-family ipv4 unicast
  network 10.255.0.1/32
  neighbor {{peer_ip}} activate
 exit-address-family
!
end
write memory
!
exit
#
# ---- 保存并查看 ----
sudo config save -y
# show ip bgp summary
# show ip route
#
return
