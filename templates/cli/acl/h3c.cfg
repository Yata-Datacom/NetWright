# ============================================================
# NetForge 内置模板 — ACL 访问控制（时间对象 / 结合接口） · 新华三 Comware
# 场景: 标准/高级 ACL 限制互访，含时段控制，并在接口方向应用。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
acl advanced 3000
 rule 5 permit ip source 192.168.10.0 0.0.0.255 destination 192.168.30.0 0.0.0.255
 rule 10 deny tcp destination-port eq 3389
 rule 100 permit ip

time-range WORKTIME 08:00 to 18:00 working-day

interface Vlan-interface10
 packet-filter 3000 inbound
