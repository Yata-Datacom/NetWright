# ============================================================
# NetForge 内置模板 — ACL 访问控制（时间对象 / 结合接口） · 思科 IOS-XE/NX-OS
# 场景: 标准/高级 ACL 限制互访，含时段控制，并在接口方向应用。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
ip access-list extended ACL-VLAN10
 permit ip 192.168.10.0 0.0.0.255 192.168.30.0 0.0.0.255
 deny tcp 192.168.10.0 0.0.0.255 any eq 3389
 permit ip any any

! ---- 时间范围 ----
time-range WORKTIME
 periodic weekdays 08:00 to 18:00

interface Vlan10
 ip access-group ACL-VLAN10 in
