# ============================================================
# NetForge 内置模板 — VXLAN + BGP EVPN（Spine-Leaf 分布式网关） · 华为 VRP
# 场景: 数据中心 Overlay：Underlay OSPF 打通，BGP EVPN 传递 MAC/IP 路由，Leaf 双活网关。以 2 Spine + 2 Leaf 为例。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ================= 通用：Underlay + EVPN 基础 =================
# ---- Underlay OSPF（互联口）----
ospf 1 router-id <本机Loopback0>
 area 0
  network 10.0.0.0 0.0.255.255
  network <本机Loopback0> 0.0.0.0

# ---- EVPN 实例与 BD ----
bridge-domain 10
 vxlan vni 10
 evpn
  route-distinguisher 1:10
  vpn-target 10:10 export-extcommunity
  vpn-target 10:10 import-extcommunity

# ================= Leaf（VTEP / 分布式网关）=================
interface Loopback0
 ip address 10.1.1.1 255.255.255.255   # VTEP 源地址
interface Loopback1
 ip address 10.2.1.1 255.255.255.255   # 双活网关 anycast 地址

# ---- NVE 隧道口 ----
interface Nve1
 source 10.1.1.1
 vni 10 head-end peer-list
 mac-address 00e0.fc00.0001            # 双活网关统一虚 MAC

# ---- BGP EVPN 控制面 ----
bgp 65001 instance evpn
 router-id 10.1.1.1
 peer 10.0.0.1 as-number 65001          # Spine1 loopback
 peer 10.0.0.2 as-number 65001          # Spine2 loopback
 #
 l2vpn-family evpn
  policy vpn-target
  peer 10.0.0.1 enable
  peer 10.0.0.2 enable
  peer 10.0.0.1 advertise encap-type vxlan
  peer 10.0.0.2 advertise encap-type vxlan

# ---- 接入业务口 ----
interface GigabitEthernet1/0/1
 undo portswitch
 port link-type access
 port default vlan 10

# ================= Spine（仅路由反射，不建 VTEP）=================
bgp 65001 instance evpn
 router-id 10.0.0.1
 peer 10.1.1.1 as-number 65001
 peer 10.1.1.2 as-number 65001
 #
 l2vpn-family evpn
  peer 10.1.1.1 enable
  peer 10.1.1.1 reflect-client
  peer 10.1.1.2 enable
  peer 10.1.1.2 reflect-client
  reflect change-path-attribute
