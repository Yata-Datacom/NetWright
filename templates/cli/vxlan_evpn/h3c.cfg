# ============================================================
# NetForge 内置模板 — VXLAN + BGP EVPN（Spine-Leaf 分布式网关） · 新华三 Comware
# 场景: 数据中心 Overlay：Underlay OSPF 打通，BGP EVPN 传递 MAC/IP 路由，Leaf 双活网关。以 2 Spine + 2 Leaf 为例。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ================= Leaf =================
# ---- Underlay ----
ospf 1 router-id 10.1.1.1
 area 0
  network 10.0.0.0 0.0.255.255

# ---- VSI 与 VXLAN ----
vsi V10
 vxlan 10
 evpn encapsulation vxlan
  route-distinguisher 1:10
  vpn-target 10:10 both

# ---- 隧道口 ----
interface Tunnel1 mode vxlan
 source 10.1.1.1
 destination 10.1.1.2                  # 对端 Leaf（可由 EVPN 自动建）

# ---- 双活网关（分布式聚合网关）----
interface Vsi-interface10
 ip address 10.2.10.1 255.255.255.0    # anycast 网关
 mac-address 00e0-fc00-0001

# ---- BGP EVPN ----
bgp 65001
 router-id 10.1.1.1
 peer 10.0.0.1 as-number 65001
 peer 10.0.0.2 as-number 65001
 address-family l2vpn evpn
  peer 10.0.0.1 enable
  peer 10.0.0.2 enable
  peer 10.0.0.1 advertise-community

# ---- 接入口 ----
interface GigabitEthernet1/0/1
 port access vlan 10

# ================= Spine（RR）=================
bgp 65001
 router-id 10.0.0.1
 peer 10.1.1.1 as-number 65001
 peer 10.1.1.2 as-number 65001
 address-family l2vpn evpn
  peer 10.1.1.1 enable
  peer 10.1.1.1 reflect-client
  peer 10.1.1.2 enable
  peer 10.1.1.2 reflect-client
