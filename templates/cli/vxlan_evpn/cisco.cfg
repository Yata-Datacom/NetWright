# ============================================================
# NetForge 内置模板 — VXLAN + BGP EVPN（Spine-Leaf 分布式网关） · 思科 IOS-XE/NX-OS
# 场景: 数据中心 Overlay：Underlay OSPF 打通，BGP EVPN 传递 MAC/IP 路由，Leaf 双活网关。以 2 Spine + 2 Leaf 为例。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
! ================= Leaf（NX-OS，以 Nexus 为例）=================
feature ospf
feature bgp
feature nv overlay
feature interface-vlan
feature vn-segment-vlan-based

! ---- Underlay ----
router ospf 1
 router-id 10.1.1.1

! ---- VLAN 与 VNI 映射 + anycast 网关 ----
vlan 10
 vn-segment 10010
interface Vlan10
 no shutdown
 ip address 10.2.10.1/24               # 分布式 anycast 网关
 fabric forwarding mode anycast-gateway

! ---- NVE ----
interface nve1
 no shutdown
 host-reachability protocol bgp
 source-interface loopback0
 member vni 10010
  suppress-arp
  mcast-group 239.1.1.10               # 或 ingress-replication protocol bgp

! ---- L3VNI（三层网关互通）----
vrf context OVERLAY
 vni 50000
interface nve1
 member vni 50000
  suppress-arp
vlan 500
 vn-segment 50000

! ---- BGP EVPN ----
router bgp 65001
 router-id 10.1.1.1
 address-family l2vpn evpn
  maximum-paths 2
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 update-source loopback0
 neighbor 10.0.0.1 address-family l2vpn evpn
  send-community extended
 neighbor 10.0.0.2 remote-as 65001
 neighbor 10.0.0.2 update-source loopback0
 neighbor 10.0.0.2 address-family l2vpn evpn
  send-community extended
 vrf OVERLAY
  address-family ipv4 unicast
   advertise l2vpn evpn

! ================= Spine（RR）=================
router bgp 65001
 router-id 10.0.0.1
 address-family l2vpn evpn
 neighbor 10.1.1.1 remote-as 65001
 neighbor 10.1.1.1 update-source loopback0
 neighbor 10.1.1.1 address-family l2vpn evpn
  send-community extended
  route-reflector-client
 neighbor 10.1.1.2 remote-as 65001
 neighbor 10.1.1.2 update-source loopback0
 neighbor 10.1.1.2 address-family l2vpn evpn
  send-community extended
  route-reflector-client
