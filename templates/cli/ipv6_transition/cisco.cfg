! ============================================================
! NetForge 内置模板 — IPv6 过渡：NAT64/DNS64（思科 IOS-XE）
! 场景：IPv6-only 终端访问 IPv4 互联网（有状态 NAT64）+ DNS64 合成 AAAA
! 注意：NAT64 需要 IOS-XE 安全特性包，命令随版本差异较大。
! 模板变量：
!   nat64_prefix        DNS64 合成前缀（64:ff9b::/96）
!   pool_v4_start / pool_v4_end     公网 IPv4 地址池
!   acl_v6_source       允许 NAT64 的 IPv6 源网段
! 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
! ============================================================
!
hostname {{hostname}}
!
ipv6 unicast-routing
!
! ---- NAT64 地址池与规则（IOS-XE 示意写法）----
nat64 prefix stateful {{nat64_prefix}}
nat64 address-group POOL1 {{pool_v4_start}} {{pool_v4_end}}
nat64 v6v4 list ACL-V6 pool POOL1 overload
!
ipv6 access-list ACL-V6
 permit ipv6 {{acl_v6_source}} any
!
interface GigabitEthernet0/1
 nat64 enable
!
interface GigabitEthernet0/0
 ip address {{pool_v4_start}} 255.255.255.252
 nat64 enable
!
! ---- 查看 ----
! show nat64 translations
! show nat64 statistics
!
end
