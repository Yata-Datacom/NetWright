# ============================================================
# NetForge 内置模板 — IPv6 过渡：NAT64/DNS64（华为 VRP，NE/AR 类平台）
# 场景：IPv6-only 终端访问 IPv4 互联网（有状态 NAT64）+ DNS64 合成 AAAA
# 注意：NAT64 依赖平台 CGN/安全特性 License，命令随版本差异较大，
#       下发前务必对照设备手册核对。
# 模板变量：
#   nat64_prefix        DNS64 合成前缀（业界惯用 64:ff9b::/96，IETF RFC 6052）
#   pool_v4_start / pool_v4_end     NAT64 公网 IPv4 地址池
#   acl_v6_source       允许做 NAT64 的 IPv6 源网段
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
# ============================================================
#
sysname {{hostname}}
#
# ---- DNS64：把 A 记录合成 AAAA（前缀 64:ff9b::/96）----
dns resolve
dns-proxy enable
#
# ---- NAT64：IPv6 源 → IPv4 地址池 ----
acl ipv6 2000
 rule 5 permit ipv6 source {{acl_v6_source}}
#
# ---- NAT64 前缀与地址池（示意写法，平台相关）----
# nat64 prefix {{nat64_prefix}}
# nat64 address-group POOL1 {{pool_v4_start}} {{pool_v4_end}}
# nat64 outbound 2000 address-group POOL1
#
interface GigabitEthernet0/0/0
 nat64 enable
#
# ---- 业务口保持 IPv6-only ----
interface Vlanif {{mgmt_vlan}}
 ipv6 enable
 ipv6 address {{mgmt_ip}} {{mask}}
#
# ---- 查看 ----
# display nat64 session
# display nat64 statistics
#
return
