# ============================================================
# NetForge 内置模板 — MikroTik VLAN（网桥 VLAN filtering，RouterOS v7）
# 场景：bridge vlan-filtering 三层 VLAN + 网关 SVI（vlan 接口）
# 模板变量：
#   vlan_ids        VLAN 列表，如 10,20
#   bridge_name     网桥名（默认 bridge-lan）
#   trunk_ports     Trunk 物理口，如 ether1,ether2
#   access_port     Access 物理口（每口一个 VLAN，见模板内注释）
#   sv6? 无需
# ============================================================
#
# ---- 网桥开启 VLAN filtering ----
/interface bridge set {{bridge_name}} vlan-filtering=yes
#
# ---- 批量建 VLAN ----
/interface bridge vlan add bridge={{bridge_name}} tagged={{bridge_name}},{{trunk_ports}} vlan-ids={{vlan_ids}}
#
# ---- Trunk 口加入网桥 ----
/interface bridge port add bridge={{bridge_name}} interface={{trunk_ports}} pvid=1
#
# ---- Access 口示例（每个口复制一段，改 vlan-id）----
# /interface bridge port add bridge={{bridge_name}} interface=ether3 pvid=10
#
# ---- VLAN 网关 SVI（三层）----
/interface vlan add interface={{bridge_name}} vlan-id=10 name=vlan10
/interface vlan add interface={{bridge_name}} vlan-id=20 name=vlan20
/ip address add address=192.168.10.1/24 interface=vlan10
/ip address add address=192.168.20.1/24 interface=vlan20
#
# ---- 查看 ----
# /interface bridge vlan print
# /interface bridge port print
#
return
