# ============================================================
# NetForge 内置模板 — RoCEv2 无损网络（PFC + ECN + DSCP 映射 + 巨帧） · 华为 VRP
# 场景: 分布式存储/AI 训练场景：RDMA 流量进专用无丢包队列（PFC no-drop），拥塞时 ECN 主动通知源端降速（配合 WRED 阈值），DSCP 46 → COS 5 映射，全网巨帧。注意：全链路 MTU 必须一致，服务器侧网卡（如 Mellanox：set_pcp、cma_roce_tos=46）需同步配置。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ================= 华为 CE 系列 RoCEv2 基线 =================
# ---- 全局使能 DCB ----
dcb enable

# ---- 无丢弃模板（队列 5 no-drop）----
dcb pfc
 priority 5                         # 声明 5 号优先级为 no-drop

# ---- ECN / WRED（拥塞时打 ECN 标记而非丢包）----
wred wred-name ROCE-WRED
 ecn enable
 discard-percentage low-limit 20 high-limit 70
                                     # 队列积压 20%~70% 区间做 ECN 标记

# ---- Diffserv 域：DSCP 46 <-> COS 5 双向映射 ----
diffserv-domain ROCE-DS
 dscp-inbound 46 map-priority 5      # 入方向：RoCE 报文进 5 号队列
 dscp-outbound 5 map 46              # 出方向还原

# ---- 接口模板（RoCE 存储口）----
interface 10GE1/0/1
 description TO-ROCE-STORAGE
 jumboframe enable 9216              # 巨帧，全链路一致
 trust dscp
 diffserv-domain ROCE-DS
 dcb pfc enable
 dcb pfc priority 5                  # 本口 no-drop 队列
 dcb wred ROCE-WRED                  # 出队列挂 ECN
 dcb ets enable                      # ETS 带宽分组（可选）
 dcb ets queue 5 pq                  # RoCE 队列严格优先（按需）

# ---- 检查 ----
# display dcb pfc interface 10GE1/0/1     # PFC 收发 PAUSE 帧计数
# display dcb wred interface 10GE1/0/1    # ECN 标记计数
# PFC PAUSE 持续增长说明拥塞点在此，配合 ECN 阈值调整
