# ============================================================
# NetForge 内置模板 — RoCEv2 无损网络（PFC + ECN + DSCP 映射 + 巨帧） · 思科 IOS-XE/NX-OS
# 场景: 分布式存储/AI 训练场景：RDMA 流量进专用无丢包队列（PFC no-drop），拥塞时 ECN 主动通知源端降速（配合 WRED 阈值），DSCP 46 → COS 5 映射，全网巨帧。注意：全链路 MTU 必须一致，服务器侧网卡（如 Mellanox：set_pcp、cma_roce_tos=46）需同步配置。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
! ================= Cisco Nexus RoCEv2 基线 =================
! ---- 网络级 QoS：no-drop 类（COS 5）+ 巨帧 ----
class-map type network-qos match-any NQ-ROCE
 match dot1p 5
policy-map type network-qos NQ-POL
 class type network-qos NQ-ROCE
  pause no-drop                      ! PFC no-drop
  mtu 9216                           ! 巨帧
  set cos 5
 class type network-qos class-default
  mtu 9216
system qos
 service-policy type network-qos NQ-POL

! ---- 入方向：DSCP 46 标记为 COS 5 ----
class-map type qos match-any Q-ROCE
 match dscp 46
policy-map type qos Q-MARK-ROCE
 class Q-ROCE
  set cos 5
system qos
 service-policy type qos input Q-MARK-ROCE

! ---- ECN（排队策略，配合 WRED）----
policy-map type queuing Q-OUT
 class type queuing c-out-q5
  bandwidth percent 40
  random-detect minimum-threshold 1500 kbytes maximum-threshold 5000 kbytes
  random-detect ecn                  ! ECN 标记
system qos
 service-policy type queuing output Q-OUT

! ---- 接口 ----
interface Ethernet1/1
 description TO-ROCE-STORAGE
 priority-flow-control mode auto
 service-policy type qos input Q-MARK-ROCE

! ---- PFC 看门狗（防冤死流）----
priority-flow-control watchdog
! ---- 检查 ----
! show priority-flow-control
! show queuing interface ethernet1/1
