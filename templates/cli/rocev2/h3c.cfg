# ============================================================
# NetForge 内置模板 — RoCEv2 无损网络（PFC + ECN + DSCP 映射 + 巨帧） · 新华三 Comware
# 场景: 分布式存储/AI 训练场景：RDMA 流量进专用无丢包队列（PFC no-drop），拥塞时 ECN 主动通知源端降速（配合 WRED 阈值），DSCP 46 → COS 5 映射，全网巨帧。注意：全链路 MTU 必须一致，服务器侧网卡（如 Mellanox：set_pcp、cma_roce_tos=46）需同步配置。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ================= H3C Comware RoCEv2 基线 =================
# ---- PFC 无损队列（COS 5）----
priority-flow-control enable
priority-flow-control no-drop dot1p 5

# ---- ECN / WRED 策略 ----
qos wred policy ROCE-WRED
 queue 5 weighting-constant 6
 queue 5 ecn minimum-threshold 2000 maximum-threshold 10000
                                     # 队列深度 2k~10k 区间 ECN 标记
 queue 5 drop-level discard-probability 10

# ---- DSCP -> COS 映射 ----
qos map dscp 46 to dot1p 5

# ---- 接口模板 ----
interface Ten-GigabitEthernet1/0/1
 description TO-ROCE-STORAGE
 jumbo enable                        # 巨帧（部分型号 jumboframe enable）
 qos trust dscp
 priority-flow-control enable auto
 priority-flow-control no-enable dot1p 0,1,2,3,4,6,7
                                     # 仅 5 号队列 no-drop
 qos wred apply ROCE-WRED

# ---- ETS（可选）----
# qos wrr queue 5 group sp

# ---- 检查 ----
# display priority-flow-control interface
# display qos wred interface
# display qos map-table dscp-dot1p
