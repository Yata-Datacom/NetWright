# ============================================================
# NetForge 内置模板 — DHCP 服务（地址池 / 中继） · 华为 VRP
# 场景: 网关侧地址池下发（含 DNS/网关/租期/静态绑定），或中继到远端 DHCP 服务器。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- 服务端 ----
dhcp enable

ip pool VLAN10
 gateway-list 192.168.10.1
 network 192.168.10.0 mask 255.255.255.0
 excluded-ip-address 192.168.10.240 192.168.10.254
 dns-list 223.5.5.5 114.114.114.114
 lease day 3 hour 0 minute 0
 option 43 sub-option 2 ip-address 10.1.1.100   # AP 场景示例

interface Vlanif10
 dhcp select global

# ---- 静态绑定 ----
# ip pool VLAN10
#  static-bind ip-address 192.168.10.88 mac-address 5489-98ab-cd12

# ---- 中继侧 ----
# interface Vlanif10
#  dhcp select relay
#  dhcp relay server-ip 10.1.1.100
