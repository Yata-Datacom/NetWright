# ============================================================
# NetForge 内置模板 — DHCP 服务（地址池 / 中继） · 新华三 Comware
# 场景: 网关侧地址池下发（含 DNS/网关/租期/静态绑定），或中继到远端 DHCP 服务器。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
dhcp enable

dhcp server ip-pool VLAN10
 gateway-list 192.168.10.1
 network 192.168.10.0 mask 255.255.255.0
 address range 192.168.10.10 192.168.10.240
 dns-list 223.5.5.5 114.114.114.114
 expired day 3 hour 0 minute 0

interface Vlan-interface10
 dhcp select server

# ---- 中继 ----
# interface Vlan-interface10
#  dhcp select relay
#  dhcp relay server-address 10.1.1.100
