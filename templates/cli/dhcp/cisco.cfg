# ============================================================
# NetForge 内置模板 — DHCP 服务（地址池 / 中继） · 思科 IOS-XE/NX-OS
# 场景: 网关侧地址池下发（含 DNS/网关/租期/静态绑定），或中继到远端 DHCP 服务器。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
ip dhcp excluded-address 192.168.10.1 192.168.10.10
ip dhcp excluded-address 192.168.10.240 192.168.10.254

ip dhcp pool VLAN10
 network 192.168.10.0 255.255.255.0
 default-router 192.168.10.1
 dns-server 223.5.5.5 114.114.114.114
 lease 3

! ---- 静态绑定（单独池）----
ip dhcp pool STATIC-PC
 host 192.168.10.88 255.255.255.0
 client-identifier 0154.8998.abcd.12

! ---- 中继 ----
interface Vlan10
 ip helper-address 10.1.1.100
