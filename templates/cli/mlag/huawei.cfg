# ============================================================
# NetForge 内置模板 — M-LAG / DRNI / vPC 跨设备链路聚合 · 华为 VRP
# 场景: 两台设备逻辑成一台对接服务器/交换机，双活无环。华为 M-LAG、H3C DRNI、思科 vPC 三种写法。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ================= 核心 A（M-LAG 主）=================
# ---- DFS Group（心跳走管理网）----
dfs-group 1
 priority 150
 peer 10.0.100.2 vpn-instance management

# ---- peer-link（双活心跳链路，聚合口）----
interface Eth-Trunk 0
 mode lacp-static
 peer-link 1
 trunkport GigabitEthernet 1/0/47 to 1/0/48

# ---- M-LAG 成员口（业务侧）----
interface Eth-Trunk 10
 mode lacp-static
 dfs-group 1 m-lag 10
 port link-type trunk
 port trunk allow-pass vlan 10 20
 trunkport GigabitEthernet 1/0/1 to 1/0/2

# ---- M-LAG 双活网关 VLANIF ----
interface Vlanif10
 ip address 192.168.10.2 255.255.255.0
 mac-address 00e0-fc00-0010            # 双机一致虚 MAC
 vrrp vrid 10 virtual-ip 192.168.10.1  # 或直接双活网关方案

# 核心 B：dfs-group priority 100，peer 指向 10.0.100.1，其余对称
# 保留 VLAN / 逃生口：建议配置 eth-trunk 0 为 peer-link 且排除管理 VLAN
