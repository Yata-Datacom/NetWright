# ============================================================
# NetForge 内置模板 — M-LAG / DRNI / vPC 跨设备链路聚合 · 思科 IOS-XE/NX-OS
# 场景: 两台设备逻辑成一台对接服务器/交换机，双活无环。华为 M-LAG、H3C DRNI、思科 vPC 三种写法。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
! ================= Leaf A（vPC 主）=================
feature vpc
feature lacp

! ---- vPC keepalive 心跳 ----
vpc domain 1
 peer-switch
 role priority 100                     ! B 机 200
 peer-keepalive destination 10.0.100.2 source 10.0.100.1
 peer-gateway
 auto-recovery
 ip arp synchronize

! ---- peer-link ----
interface port-channel 1
 vpc peer-link
 switchport mode trunk
 switchport trunk allowed vlan 10,20

interface ethernet1/47
 channel-group 1 mode active
interface ethernet1/48
 channel-group 1 mode active

! ---- vPC 成员口（接服务器）----
interface port-channel 10
 vpc 10
 switchport mode trunk
 switchport trunk allowed vlan 10,20

interface ethernet1/1
 channel-group 10 mode active
interface ethernet1/2
 channel-group 10 mode active
