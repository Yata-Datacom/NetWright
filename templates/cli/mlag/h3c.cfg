# ============================================================
# NetForge 内置模板 — M-LAG / DRNI / vPC 跨设备链路聚合 · 新华三 Comware
# 场景: 两台设备逻辑成一台对接服务器/交换机，双活无环。华为 M-LAG、H3C DRNI、思科 vPC 三种写法。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ================= 核心 A（DRNI 主）=================
# ---- DR 系统（心跳+Peer 链路）----
drni system-mac 0001-0001-0001         # 双机一致
drni system-number 1                   # B 机为 2
drni system-priority 100
drni keepalive ip destination 10.0.100.2 source 10.0.100.1

# ---- IPP 口（内部互联口）----
interface Bridge-Aggregation 1
 link-aggregation mode dynamic
 port drni intra-portal-port 1
interface GigabitEthernet1/0/47
 port link-aggregation group 1
interface GigabitEthernet1/0/48
 port link-aggregation group 1

# ---- DR 口（业务聚合）----
interface Bridge-Aggregation 10
 link-aggregation mode dynamic
 port drni group 10
 port link-type trunk
 port trunk permit vlan 10 20
interface GigabitEthernet1/0/1
 port link-aggregation group 10
interface GigabitEthernet1/0/2
 port link-aggregation group 10
