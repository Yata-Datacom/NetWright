# ============================================================
# NetForge 内置模板 — GRE over IPsec 站点互联 · 新华三 Comware
# 场景: 分支-总部隧道：先建 GRE 承载路由，再叠加 IPsec 加密保护（IKE 协商）。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
acl advanced 3000
 rule 5 permit gre source 1.1.1.1 destination 2.2.2.2

ike proposal 10
 encryption-algorithm aes-cbc-256
 authentication-algorithm sha256
 dh group14

ike keychain BRANCH
 pre-shared-key address 2.2.2.2 255.255.255.255 key cipher Hq@Tunnel123

ike profile BRANCH
 keychain BRANCH
 match remote identity address 2.2.2.2 255.255.255.255

ipsec transform-set TUN
 encapsulation-mode tunnel
 protocol esp
 esp encryption-algorithm aes-cbc-256
 esp authentication-algorithm sha256

ipsec policy POL 10 isakmp
 transform-set TUN
 security acl 3000
 remote-address 2.2.2.2
 ike-profile BRANCH

interface Tunnel0 mode gre
 ip address 172.16.0.1 255.255.255.252
 source GigabitEthernet1/0/0
 destination 2.2.2.2
 ipsec apply policy POL
