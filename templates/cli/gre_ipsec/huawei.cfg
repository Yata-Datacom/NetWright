# ============================================================
# NetForge 内置模板 — GRE over IPsec 站点互联 · 华为 VRP
# 场景: 分支-总部隧道：先建 GRE 承载路由，再叠加 IPsec 加密保护（IKE 协商）。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- ACL 感兴趣流（保护 GRE 报文）----
acl 3000
 rule 5 permit gre source 1.1.1.1 destination 2.2.2.2

# ---- IKE 安全提议与对等体 ----
ike proposal 10
 encryption-algorithm aes-256
 authentication-algorithm sha2-256
 dh group14

ike peer BRANCH v2
 pre-shared-key cipher Hq@Tunnel123
 remote-address 2.2.2.2

# ---- IPsec 提议与策略 ----
ipsec proposal TUN
 encapsulation-mode tunnel
 transform esp
 esp authentication-algorithm sha2-256
 esp encryption-algorithm aes-256

ipsec policy POL 10 isakmp
 security acl 3000
 ike-peer BRANCH
 proposal TUN

# ---- GRE 隧道并挂 IPsec ----
interface Tunnel0/0/0
 ip address 172.16.0.1 255.255.255.252
 tunnel-protocol gre
 source GigabitEthernet0/0/0          # 公网出口（地址 1.1.1.1）
 destination 2.2.2.2
 ipsec policy POL

# ---- 隧道跑 OSPF ----
ospf 1
 area 0
  network 172.16.0.0 0.0.0.3
