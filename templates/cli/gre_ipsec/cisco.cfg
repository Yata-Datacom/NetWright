# ============================================================
# NetForge 内置模板 — GRE over IPsec 站点互联 · 思科 IOS-XE/NX-OS
# 场景: 分支-总部隧道：先建 GRE 承载路由，再叠加 IPsec 加密保护（IKE 协商）。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
! ---- IKEv2 提议与密钥 ----
crypto ikev2 proposal IKE-PROP
 encryption aes-gcm-256
 prf sha512
 group 14
crypto ikev2 policy IKE-POL
 proposal IKE-PROP
crypto ikev2 keyring KEYRING
 peer BRANCH
  address 2.2.2.2
  pre-shared-key Hq@Tunnel123
crypto ikev2 profile IKE-PROF
 match identity remote address 2.2.2.2 255.255.255.255
 authentication local pre-share
 authentication remote pre-share
 keyring local KEYRING

! ---- IPsec 变换集与配置文件 ----
crypto ipsec transform-set TSET esp-gcm 256
 mode tunnel
crypto ipsec profile IPSEC-PROF
 set transform-set TSET
 set ikev2-profile IKE-PROF

! ---- GRE 隧道挂保护 ----
interface Tunnel0
 ip address 172.16.0.1 255.255.255.252
 tunnel source GigabitEthernet0/0
 tunnel destination 2.2.2.2
 tunnel protection ipsec profile IPSEC-PROF

router ospf 1
 network 172.16.0.0 0.0.0.3 area 0
