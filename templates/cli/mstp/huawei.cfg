# ============================================================
# NetForge 内置模板 — MSTP 多生成树 + 根桥保护 · 华为 VRP
# 场景: 多实例生成树，按 VLAN 分组负载分担；配置根桥/备根与边缘端口。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- MSTP 域与实例 ----
stp region-configuration
 region-name CAMPUS
 revision-level 1
 instance 1 vlan 10 20
 instance 2 vlan 30 40
 active region-configuration

# ---- 核心 A：实例 1 主根、实例 2 备根 ----
stp instance 1 root primary
stp instance 2 root secondary
stp mode mstp

# ---- 接入口 ----
interface GigabitEthernet0/0/1
 stp edged-port enable
 stp bpdu-filter enable
