# ============================================================
# NetForge 内置模板 — CloudEngine 数据中心基线（华为 CE 星河 AI Fabric 准备层）
# 场景：AI/云数据中心交换机开局基线——LLDP/BFD 可靠性、SSH/NETCONF 管理、
#       NTP/SNMPv3/日志、光口监控、DCN 习惯配置；为上层 VXLAN+EVPN、
#       RoCEv2 无损（PFC/ECN，见独立模板）打底。
# 模板变量：
#   ospf_router_id  管理用途 Router-ID（可复用 Loopback0）
#   core_password   本地管理账号密码（建议作为项目凭据）
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
# ============================================================
#
sysname {{hostname}}
#
# ---- 基础可靠性协议（DC 标配）----
lldp enable
bfd all-interfaces enable
#
# ---- 管理地址 ----
interface Vlanif {{mgmt_vlan}}
 ip address {{mgmt_ip}} {{mask}}
#
interface LoopBack0
 ip address {{ospf_router_id}} 255.255.255.255
#
# ---- NETCONF / SSH 管理面（供 NetPilot 等工具接入）----
snetconf server enable
stelnet server enable
ssh server-source all-interface
ssh client first-time enable
ssh server cipher aes256_ctr
ssh server dh-exchange min-len 2048
#
netconf
 agent protocol ssh port 830
#
aaa
 local-user admin password irreversible-cipher {{core_password}}
 local-user admin privilege level 15
 local-user admin service-type ssh terminal
#
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh
#
# ---- 时间与监控 ----
ntp-service unicast-server {{gateway}}
snmp-agent
 snmp-agent sys-info version v3
snmp-agent group v3 NMS-GRP privacy
snmp-agent usm-user v3 netmon NMS-GRP authentication-mode sha2-256 cipher {{core_password}} privacy-mode aes-256 cipher {{core_password}}
info-center loghost {{gateway}}
#
# ---- 光口监控基线（AI Fabric 光链路健康前置）----
#
# telemetry / 错误码收敛习惯配置
#
undo icmp name timestamp-request receive
#
ip route-static 0.0.0.0 0.0.0.0 {{gateway}}
#
lldp management-address {{mgmt_ip}}
#
return
