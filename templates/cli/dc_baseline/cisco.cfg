! ============================================================
! NetForge 内置模板 — 数据中心基线（思科 NX-OS）
! 场景：DC 交换机开局基线：LLDP/BFD、SSH/NETCONF-over-SSH、NTP/SNMPv3、日志
! 模板变量：
!   ospf_router_id  Loopback0 地址
!   admin_password  admin 密码（建议作为项目凭据）
! 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
! ============================================================
!
hostname {{hostname}}
!
feature lldp
feature bfd
feature privilege
feature snmp
feature netconf
!
interface Vlan{{mgmt_vlan}}
 ip address {{mgmt_ip}}/{{mask}}
 no shutdown
!
interface loopback0
 ip address {{ospf_router_id}}/32
!
ip route 0.0.0.0/0 {{gateway}}
!
! ---- 管理面 ----
ssh key rsa 2048 force
ssh login-attempts 3
line vty
 exec-timeout 30
!
username admin password {{admin_password}} role network-admin
!
ntp server {{gateway}} use-vrf management
snmp-server contact NetOps
snmp-server user netmon NMS-GRP auth sha {{admin_password}} priv aes-128 {{admin_password}}
logging server {{gateway}} 6 use-vrf management
!
! NETCONF/YANG（NX-OS 可选特性）：
! feature netconf 后即可通过 830 端口接入 NETCONF 客户端
!
end
