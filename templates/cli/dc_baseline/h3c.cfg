# ============================================================
# NetForge 内置模板 — 数据中心基线（新华三 Comware V7）
# 场景：DC 交换机开局基线：LLDP/BFD、SSH/NETCONF、NTP/SNMPv3、日志
# 模板变量：
#   ospf_router_id  Loopback 地址
#   core_password   本地管理账号密码（建议作为项目凭据）
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
# ============================================================
#
sysname {{hostname}}
#
lldp enable
bfd all-interfaces enable
#
interface Vlan-interface{{mgmt_vlan}}
 ip address {{mgmt_ip}} {{mask}}
#
interface LoopBack0
 ip address {{ospf_router_id}} 255.255.255.255
#
ssh server enable
netconf soap server enable
netconf ssh server enable
#
local-user admin class manage
 password hash {{core_password}}
 service-type ssh
 authorization-attribute user-role network-admin
#
line vty 0 4
 authentication-mode scheme
 protocol inbound ssh
 user-role network-admin
#
ntp-service unicast-server {{gateway}}
snmp-agent
 snmp-agent sys-info version v3
info-center loghost {{gateway}}
#
ip route-static 0.0.0.0 0.0.0.0 {{gateway}}
#
return
