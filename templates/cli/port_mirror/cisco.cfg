# ============================================================
# NetForge 内置模板 — 端口镜像（抓包/旁路审计设备接入） · 思科 IOS-XE/NX-OS
# 场景: 把业务口流量复制到观察口，接抓包机或安全审计设备。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
! ---- SPAN：源口 -> 目的口 ----
monitor session 1 source interface GigabitEthernet0/1 both
monitor session 1 destination interface GigabitEthernet0/24

! ---- VLAN 镜像 ----
monitor session 2 source vlan 10 both
monitor session 2 destination interface GigabitEthernet0/23 encapsulation replicate

! ---- 查看 ----
! show monitor session all
