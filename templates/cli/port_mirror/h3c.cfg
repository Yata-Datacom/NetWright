# ============================================================
# NetForge 内置模板 — 端口镜像（抓包/旁路审计设备接入） · 新华三 Comware
# 场景: 把业务口流量复制到观察口，接抓包机或安全审计设备。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
mirroring-group 1 local

# ---- 观察口 ----
mirroring-group 1 monitor-port GigabitEthernet1/0/24

# ---- 源口（入+出）----
mirroring-group 1 mirroring-port GigabitEthernet1/0/1 both
