# ============================================================
# NetForge 内置模板 — 端口镜像（抓包/旁路审计设备接入） · 华为 VRP
# 场景: 把业务口流量复制到观察口，接抓包机或安全审计设备。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- 观察口 ----
observe-port 1 interface GigabitEthernet0/0/24

# ---- 业务口镜像到观察口（入+出）----
interface GigabitEthernet0/0/1
 port-mirroring to observe-port 1 inbound
 port-mirroring to observe-port 1 outbound

# ---- 流镜像（基于 ACL，可选）----
# traffic classifier MIRROR
#  if-match acl 3000
# traffic behavior B-MIRROR
#  mirror to observe-port 1
