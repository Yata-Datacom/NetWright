# ============================================================
# NetForge 内置模板 — VLAN 基础（Access / Trunk / VLANIF） · 华为 VRP
# 场景: 划分业务 VLAN，配置 Access/Trunk 端口与三层网关 VLANIF。最常用的起步模板。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- 创建 VLAN ----
vlan batch 10 20 100

# ---- Access 口（接终端）----
interface GigabitEthernet0/0/1
 port link-type access
 port default vlan 10
 stp edged-port enable

# ---- Trunk 口（接交换机/AP）----
interface GigabitEthernet0/0/24
 port link-type trunk
 port trunk allow-pass vlan 10 20 100
 port trunk pvid vlan 100

# ---- 三层网关 ----
interface Vlanif10
 ip address 192.168.10.1 255.255.255.0
 description Users-VLAN10

# ---- Hybrid 口（多业务语音+数据）----
# interface GigabitEthernet0/0/2
#  port link-type hybrid
#  port hybrid pvid vlan 10
#  port hybrid untagged vlan 10
#  port hybrid tagged vlan 100
