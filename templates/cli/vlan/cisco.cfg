# ============================================================
# NetForge 内置模板 — VLAN 基础（Access / Trunk / VLANIF） · 思科 IOS-XE/NX-OS
# 场景: 划分业务 VLAN，配置 Access/Trunk 端口与三层网关 VLANIF。最常用的起步模板。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
! ---- 创建 VLAN ----
vlan 10
 name Users
vlan 20
 name Servers
vlan 100
 name Native

! ---- Access 口 ----
interface GigabitEthernet0/1
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast

! ---- Trunk 口 ----
interface GigabitEthernet0/24
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20,100
 switchport trunk native vlan 100

! ---- 三层网关（三层交换机 SVI）----
interface Vlan10
 ip address 192.168.10.1 255.255.255.0
