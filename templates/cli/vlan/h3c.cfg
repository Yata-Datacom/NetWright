# ============================================================
# NetForge 内置模板 — VLAN 基础（Access / Trunk / VLANIF） · 新华三 Comware
# 场景: 划分业务 VLAN，配置 Access/Trunk 端口与三层网关 VLANIF。最常用的起步模板。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- 创建 VLAN ----
vlan 10
vlan 20
vlan 100

# ---- Access 口 ----
interface GigabitEthernet1/0/1
 port link-mode bridge
 port access vlan 10
 stp edged-port

# ---- Trunk 口 ----
interface GigabitEthernet1/0/24
 port link-type trunk
 port trunk permit vlan 10 20 100
 port trunk pvid vlan 100

# ---- 三层网关 ----
interface Vlan-interface10
 ip address 192.168.10.1 255.255.255.0
