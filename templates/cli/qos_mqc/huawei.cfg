# ============================================================
# NetForge 内置模板 — MQC / QoS（分类-行为-策略：限速 / 重标记 / 队列调度 / WRED） · 华为 VRP
# 场景: 经典三段式：traffic classifier → behavior → policy。示例：业务流重标记 DSCP、关键流量保证带宽、P2P 限速、拥塞避免。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- 1. 流分类 ----
traffic classifier VOICE
 if-match dscp ef
traffic classifier VIDEO
 if-match dscp af41
traffic classifier P2P
 if-match acl 3001                     # acl 3001 定义 P2P 特征

# ---- 2. 流行为 ----
traffic behavior B-VOICE
 remark dscp ef
 queue llq bandwidth 10000             # LLQ 严格优先 10M
traffic behavior B-VIDEO
 queue af bandwidth 50000              # AF 保证带宽 50M
 remark dscp af41
traffic behavior B-P2P
 car cir 10000 pir 20000               # 限速 10M 突发 20M
 remark dscp cs1

# ---- 3. 流策略绑定 ----
traffic policy QOS-POLICY
 classifier VOICE behavior B-VOICE
 classifier VIDEO behavior B-VIDEO
 classifier P2P behavior B-P2P

# ---- 4. 接口应用（入方向重标记+限速，出方向队列调度）----
interface GigabitEthernet0/0/24
 trust dscp
 qos apply policy QOS-POLICY inbound

# ---- 拥塞避免（出接口 WRED）----
drop-profile WRED
 wred dscp
 dscp cs1 low-limit 40 high-limit 80 discard-percentage 50

# ---- 查看统计 ----
# display qos policy statistics interface GigabitEthernet0/0/24 inbound
