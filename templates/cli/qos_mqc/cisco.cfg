# ============================================================
# NetForge 内置模板 — MQC / QoS（分类-行为-策略：限速 / 重标记 / 队列调度 / WRED） · 思科 IOS-XE/NX-OS
# 场景: 经典三段式：traffic classifier → behavior → policy。示例：业务流重标记 DSCP、关键流量保证带宽、P2P 限速、拥塞避免。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
! ---- 1. 分类 ----
class-map match-any VOICE
 match dscp ef
class-map match-any VIDEO
 match dscp af41
class-map match-any P2P
 match access-group name ACL-P2P

! ---- 2. 策略：子策略（入向标记限速）+ 父策略（出向调度）----
policy-map MARK-IN
 class VOICE
  set dscp ef
 class P2P
  set dscp cs1
  police cir 10000000 bc 250000
   conform-action transmit
   exceed-action drop

policy-map WAN-OUT
 class VOICE
  priority percent 20                  ! LLQ 严格优先
 class VIDEO
  bandwidth percent 50
  fair-queue
 class class-default
  fair-queue
  random-detect dscp-based             ! WRED

! ---- 3. 应用 ----
interface GigabitEthernet0/24
 service-policy input MARK-IN
interface GigabitEthernet0/0
 service-policy output WAN-OUT

! ---- 查看 ----
! show policy-map interface GigabitEthernet0/0
