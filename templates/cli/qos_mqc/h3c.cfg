# ============================================================
# NetForge 内置模板 — MQC / QoS（分类-行为-策略：限速 / 重标记 / 队列调度 / WRED） · 新华三 Comware
# 场景: 经典三段式：traffic classifier → behavior → policy。示例：业务流重标记 DSCP、关键流量保证带宽、P2P 限速、拥塞避免。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- 1. 流分类 ----
traffic classifier VOICE
 if-match dscp ef
traffic classifier P2P
 if-match acl 3001

# ---- 2. 流行为 ----
traffic behavior B-VOICE
 remark dscp ef
 queue llq bandwidth 10000
traffic behavior B-P2P
 car cir 10000 pir 20000 red discard
 remark dscp cs1

# ---- 3. 策略与应用 ----
qos policy QOS-POLICY
 classifier VOICE behavior B-VOICE
 classifier P2P behavior B-P2P

interface GigabitEthernet1/0/24
 qos trust dscp
 qos apply policy QOS-POLICY inbound

# ---- 出方向队列调度（SP+WRR）----
interface GigabitEthernet1/0/24
 qos wrr af1 af2 af3 af4
 qos wrr af1 group 1 weight 20
