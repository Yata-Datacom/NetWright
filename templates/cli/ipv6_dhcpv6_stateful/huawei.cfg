# ============================================================
# NetForge 内置模板 — 有状态 DHCPv6（华为 VRP）
# 场景：M=1：地址由 DHCPv6 服务器集中分配（含前缀委派 PD），适合需要
#       终端地址审计/按端口分配的场景
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
# 模板变量：
#   v6_gateway      网关接口 IPv6 地址（本机）
#   dhcpv6_prefix   可分配的地址前缀，如 2001:DB8:10::/64
#   dns_v6          DNS 服务器
#   ospf_router_id / ospf_area   OSPFv3 参数
# ============================================================
#
sysname {{hostname}}
#
ipv6
#
# ---- 有状态 DHCPv6 地址池 ----
dhcpv6 pool V6-STATEFUL
 address prefix {{dhcpv6_prefix}}             # 分配主机地址
 # 委派前缀（给下游路由器，可选）：
 # delegated-prefix {{dhcpv6_prefix}} lifetime 86400 3600
 dns-server {{dns_v6}}
 domain-name lab.example
#
interface Vlanif {{mgmt_vlan}}
 ip address {{mgmt_ip}} {{mask}}
 ipv6 enable
 ipv6 address {{v6_gateway}}
 undo ipv6 nd ra halt
 ipv6 nd autoconfig managed-flag             # M=1：地址找 DHCPv6
 undo ipv6 nd autoconfig other-flag
 dhcpv6 server V6-STATEFUL
#
ospfv3 1
 router-id {{ospf_router_id}}
#
interface Vlanif {{mgmt_vlan}}
 ospfv3 1 area {{ospf_area}}
#
ipv6 route-static :: 0 {{gateway}}
#
# ---- 查看 ----
# display dhcpv6 pool
# display dhcpv6 client statistics
#
return
