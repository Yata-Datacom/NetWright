# ============================================================
# NetForge 内置模板 — 有状态 DHCPv6（新华三 Comware V7）
# 场景：M=1，地址由 DHCPv6 服务器集中分配（含前缀委派 PD）
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
# 模板变量：
#   v6_gateway / dhcpv6_prefix / dns_v6
#   ospf_router_id / ospf_area
# ============================================================
#
sysname {{hostname}}
#
ipv6
#
dhcpv6 pool V6-STATEFUL
 network {{dhcpv6_prefix}}                     # 分配主机地址
 # 委派前缀（可选）：
 # prefix-pool PD1
 dns-server {{dns_v6}}
 domain-name lab.example
#
interface Vlan-interface{{mgmt_vlan}}
 ipv6 enable
 ipv6 address {{v6_gateway}}
 undo ipv6 nd ra halt
 ipv6 nd autoconfig managed-flag              # M=1
 undo ipv6 nd autoconfig other-flag
 dhcpv6 server V6-STATEFUL
#
ospfv3 1
 router-id {{ospf_router_id}}
#
interface Vlan-interface{{mgmt_vlan}}
 ospfv3 1 area {{ospf_area}}
#
ipv6 route-static :: 0 {{gateway}}
#
return
