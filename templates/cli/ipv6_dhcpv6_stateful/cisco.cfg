! ============================================================
! NetForge 内置模板 — 有状态 DHCPv6（思科 IOS-XE）
! 场景：M=1，地址由 DHCPv6 服务器集中分配（含前缀委派 PD）
! 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
! 模板变量：
!   v6_gateway / dhcpv6_prefix / dns_v6
!   ospf_router_id / ospf_area
! ============================================================
!
hostname {{hostname}}
!
ipv6 unicast-routing
ipv6 dhcp pool V6-STATEFUL
 address prefix {{dhcpv6_prefix}}/64          ! 分配主机地址
 prefix-delegation pool PD1 lifetime 86400 valid-life 86400   ! PD（可选）
 dns-server {{dns_v6}}
 domain-name lab.example
!
ipv6 dhcp pool PD1
 prefix-delegation pool PD1
!
interface Vlan{{mgmt_vlan}}
 ipv6 enable
 ipv6 address {{v6_gateway}}
 ipv6 nd managed-config-flag                  ! M=1
 no ipv6 nd other-config-flag
 ipv6 dhcp server V6-STATEFUL
 no shutdown
!
ipv6 router ospf 1
 router-id {{ospf_router_id}}
!
interface Vlan{{mgmt_vlan}}
 ipv6 ospf 1 area {{ospf_area}}
!
ipv6 route ::/0 {{gateway}}
!
end
