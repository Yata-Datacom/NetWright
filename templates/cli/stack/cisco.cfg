# ============================================================
# NetForge 内置模板 — 堆叠虚拟化（CSS / IRF / StackWise） · 思科 IOS-XE/NX-OS
# 场景: 两台框/盒式设备堆叠成一台管理。注意先断电接堆叠线再上电，堆叠口与成员号按规划。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
! ---- StackWise（Catalyst 盒式）----
switch 1 priority 15                   ! A 机主控
switch 2 priority 10
! 物理堆叠线接好自动成环，无需软件配置堆叠口

! ---- 成员号指定（B 机）----
switch 2 renumber 2

! ---- 双活检测（跨设备聚合场景常用）----
! StackWise Virtual（CAT9K 虚拟化，类似 M-LAG）:
stackwise-virtual
 domain 1
stackwise-virtual link 1
 interface TwentyFiveGigE1/0/1
 interface TwentyFiveGigE1/0/2
stackwise-virtual dual-active detection
 interface TwentyFiveGigE1/1/1
  stackwise-virtual dual-active-detection
