# ============================================================
# NetForge 内置模板 — 堆叠虚拟化（CSS / IRF / StackWise） · 华为 VRP
# 场景: 两台框/盒式设备堆叠成一台管理。注意先断电接堆叠线再上电，堆叠口与成员号按规划。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- 堆叠口（先配后接线，防环路）----
interface Stack-Port 1/1
 port member-group interface GigabitEthernet 1/0/47 to 1/0/48

# ---- 成员号与优先级（A 机 1 号，主控）----
stack
 stack member 1 priority 200
 # B 机上执行：stack member 1 renumber 2
 # 保存后断电，连堆叠线，B 机先上电再 A 机上电

# ---- CSS 集群管理 IP（MAD 检测）----
# 双活检测（直连口 MAD）
interface GigabitEthernet 1/0/10
 mad detect mode direct
 mad ip address 10.0.200.1 255.255.255.0 member 1
 mad ip address 10.0.200.2 255.255.255.0 member 2
