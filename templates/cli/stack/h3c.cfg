# ============================================================
# NetForge 内置模板 — 堆叠虚拟化（CSS / IRF / StackWise） · 新华三 Comware
# 场景: 两台框/盒式设备堆叠成一台管理。注意先断电接堆叠线再上电，堆叠口与成员号按规划。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- IRF 域与成员号 ----
irf domain 1
irf member 1 priority 32               # A 机主控
# B 机：irf member 1 renumber 2（保存后重启生效）

# ---- IRF 物理口加入堆叠口 ----
interface Ten-GigabitEthernet1/0/49
 shutdown
irf-port 1/2
 port group interface Ten-GigabitEthernet1/0/49
interface Ten-GigabitEthernet1/0/49
 undo shutdown
# B 机对称配置 irf-port 2/1 后，先断 B 电，连线，B 先上电

# ---- MAD 检测（BFD MAD，走独立 VLAN）----
vlan 200
interface Vlan-interface200
 mad bfd enable
 mad ip address 10.0.200.1 255.255.255.0 member 1
 mad ip address 10.0.200.2 255.255.255.0 member 2
