# ============================================================
# NetForge 内置模板 — IPv6 双栈（地址 / OSPFv3 / VRRP6 / RA） · 华为 VRP
# 场景: v4+v6 双栈基线：接口 v6 地址、OSPFv3、VRRP for IPv6 网关冗余、RA 前缀公告。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- 全局使能 ----
ipv6

# ---- 接口双栈 ----
interface Vlanif10
 ipv6 enable
 ipv6 address 2001:DB8:10::1/64
 ipv6 address auto link-local
 undo ipv6 nd ra halt                 # 发布 RA，终端可 SLAAC
 ipv6 nd autoconfig managed-flag      # 提示走 DHCPv6 取地址（可选）

# ---- OSPFv3 ----
ospfv3 1
 router-id 1.1.1.1
interface Vlanif10
 ospfv3 1 area 0.0.0.0

# ---- VRRP6 网关冗余 ----
interface Vlanif10
 vrrp ipv6 vrid 10 virtual-ip FE80::1 link-local
 vrrp ipv6 vrid 10 priority 120

# ---- IPv6 静态/默认路由 ----
ipv6 route-static :: 0 2001:DB8:FF::1
