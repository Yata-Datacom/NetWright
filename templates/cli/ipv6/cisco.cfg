# ============================================================
# NetForge 内置模板 — IPv6 双栈（地址 / OSPFv3 / VRRP6 / RA） · 思科 IOS-XE/NX-OS
# 场景: v4+v6 双栈基线：接口 v6 地址、OSPFv3、VRRP for IPv6 网关冗余、RA 前缀公告。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
ipv6 unicast-routing

interface Vlan10
 ipv6 enable
 ipv6 address 2001:DB8:10::1/64
 ipv6 nd prefix 2001:DB8:10::/64 infinite infinite
 ipv6 nd other-config-flag            ! 提示走 DHCPv6 取其他参数

! ---- OSPFv3 ----
ipv6 router ospf 1
 router-id 1.1.1.1
interface Vlan10
 ipv6 ospf 1 area 0

! ---- VRRP for IPv6 ----
interface Vlan10
 vrrp 10 address-family ipv6
  address FE80::1 primary
  priority 120

ipv6 route ::/0 2001:DB8:FF::1
