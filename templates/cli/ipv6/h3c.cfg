# ============================================================
# NetForge 内置模板 — IPv6 双栈（地址 / OSPFv3 / VRRP6 / RA） · 新华三 Comware
# 场景: v4+v6 双栈基线：接口 v6 地址、OSPFv3、VRRP for IPv6 网关冗余、RA 前缀公告。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
ipv6

interface Vlan-interface10
 ipv6 enable
 ipv6 address 2001:DB8:10::1/64
 undo ipv6 nd ra halt
 ipv6 nd autoconfig managed-flag

# ---- OSPFv3 ----
ospfv3 1
 router-id 1.1.1.1
interface Vlan-interface10
 ospfv3 1 area 0.0.0.0

# ---- VRRP6 ----
interface Vlan-interface10
 vrrp ipv6 vrid 10
  virtual-ip FE80::1 link-local
  priority 120

ipv6 route-static :: 0 2001:DB8:FF::1
