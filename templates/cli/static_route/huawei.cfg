# ============================================================
# NetForge 内置模板 — 静态路由 / 浮动备份 / 静态+BFD 联动 · 华为 VRP
# 场景: 基础静态路由、低优先级浮动备份链路、静态路由绑定 BFD 实现秒级切换。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- 普通静态路由 ----
ip route-static 192.168.20.0 255.255.255.0 10.0.0.2
ip route-static 0.0.0.0 0.0.0.0 10.0.0.1

# ---- 浮动备份（preference 越大越劣）----
ip route-static 192.168.20.0 255.255.255.0 10.0.1.2 preference 100

# ---- 静态路由 + BFD 联动（主链路故障秒切）----
bfd
bfd MAIN_LINK bind peer-ip 10.0.0.2 interface GigabitEthernet0/0/0
 discriminator local 1
 discriminator remote 2
 commit

ip route-static 192.168.20.0 255.255.255.0 10.0.0.2 track bfd-session MAIN_LINK
ip route-static 192.168.20.0 255.255.255.0 10.0.1.2 preference 100

# ---- 查看路由表 ----
# display ip routing-table protocol static
