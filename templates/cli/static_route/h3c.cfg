# ============================================================
# NetForge 内置模板 — 静态路由 / 浮动备份 / 静态+BFD 联动 · 新华三 Comware
# 场景: 基础静态路由、低优先级浮动备份链路、静态路由绑定 BFD 实现秒级切换。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- 普通静态路由 ----
ip route-static 192.168.20.0 24 10.0.0.2
ip route-static 0.0.0.0 0 10.0.0.1

# ---- 浮动备份 ----
ip route-static 192.168.20.0 24 10.0.1.2 preference 100

# ---- 静态 + BFD 联动（直连下一跳）----
bfd
interface GigabitEthernet1/0/0
 bfd min-transmit-interval 100
 bfd min-receive-interval 100
 bfd detect-multiplier 3

ip route-static 192.168.20.0 24 10.0.0.2 bfd-control-packet
ip route-static 192.168.20.0 24 10.0.1.2 preference 100
