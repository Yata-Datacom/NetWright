# ============================================================
# NetForge 内置模板 — 静态路由 / 浮动备份 / 静态+BFD 联动 · 思科 IOS-XE/NX-OS
# 场景: 基础静态路由、低优先级浮动备份链路、静态路由绑定 BFD 实现秒级切换。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
! ---- 普通静态路由 ----
ip route 192.168.20.0 255.255.255.0 10.0.0.2
ip route 0.0.0.0 0.0.0.0 10.0.0.1

! ---- 浮动备份（AD 越大越劣）----
ip route 192.168.20.0 255.255.255.0 10.0.1.2 200

! ---- 静态 + IP SLA/Track 联动 ----
ip sla 1
 icmp-echo 10.0.0.2 source-interface GigabitEthernet0/0
 frequency 3
ip sla schedule 1 life forever start-time now
track 1 ip sla 1 reachability

ip route 192.168.20.0 255.255.255.0 10.0.0.2 track 1
ip route 192.168.20.0 255.255.255.0 10.0.1.2 200
