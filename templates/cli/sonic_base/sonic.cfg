# ============================================================
# NetForge 内置模板 — SONiC 基线（L2/L3 打底）
# 场景：SONiC 标准配置流程：config_db 风格命令 + SONiC CLI
#       （镜像/版本差异较大，breakout/端口别名先 plan 后配）
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
# 模板变量：
#   dns_server / ntp_server / syslog_server
# ============================================================
#
# ---- 主机名与时钟（sudo 在 SONiC shell 下执行）----
sudo config hostname {{hostname}}
sudo config ntp add {{ntp_server}}
sudo config syslog add {{syslog_server}}
#
# ---- VLAN 与成员口 ----
sudo config vlan add 10
sudo config vlan add 20
sudo config vlan member add 10 Ethernet0
sudo config vlan member add 10 Ethernet4
sudo config vlan member add 20 Ethernet8
sudo config vlan member add 20 Ethernet12
#
# ---- VLAN 接口（三层网关）----
sudo config interface ip add Vlan10 192.168.10.1/24
sudo config interface ip add Vlan20 192.168.20.1/24
#
# ---- 管理口（eth0 为带外管理）----
# sudo config interface ip add eth0 {{mgmt_ip}}/{{mask}}
#
# ---- 保存 ----
sudo config save -y
#
# ---- 查看（SONiC CLI / show）----
# show vlan brief
# show interfaces status
# show ip route summary
#
return
