# ============================================================
# NetForge 内置模板 — 管理面加固（SSH / AAA / SNMP / NTP / 日志） · 华为 VRP
# 场景: 安全远程管理基线：本地账号+SSHv2、SNMPv3、NTP、Syslog、关闭不安全服务。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- AAA 与本地账号 ----
aaa
 local-user netadmin password cipher Net@Admin123
 local-user netadmin privilege level 15
 local-user netadmin service-type ssh

# ---- SSH v2 ----
stelnet server enable
ssh user netadmin authentication-type password
ssh user netadmin service-type stelnet
ssh server cipher aes256-gcm
user-interface vty 0 4
 authentication-mode aaa
 protocol inbound ssh
 idle-timeout 10 0

# ---- SNMP v3 ----
snmp-agent
 snmp-agent sys-info version v3
 snmp-agent group v3 NMS-GRP privacy
 snmp-agent usm-user v3 netmon NMS-GRP authentication-mode sha2-256 cipher Mon@Key123 privacy-mode aes-256 cipher Mon@Key123

# ---- NTP / Syslog ----
ntp-service unicast-server 10.0.0.1
info-center loghost 10.0.0.200
