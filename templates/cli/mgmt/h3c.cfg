# ============================================================
# NetForge 内置模板 — 管理面加固（SSH / AAA / SNMP / NTP / 日志） · 新华三 Comware
# 场景: 安全远程管理基线：本地账号+SSHv2、SNMPv3、NTP、Syslog、关闭不安全服务。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- AAA ----
local-user netadmin class manage
 password cipher Net@Admin123
 service-type ssh
 authorization-attribute user-role network-admin

# ---- SSH ----
ssh server enable
ssh user netadmin service-type stelnet authentication-type password
line vty 0 4
 authentication-mode scheme
 protocol inbound ssh
 idle-timeout 10 0

# ---- SNMP v3 ----
snmp-agent
 snmp-agent sys-info version v3
snmp-agent group v3 NMS-GRP privacy
snmp-agent usm-user v3 netmon NMS-GRP authentication-mode sha256 privacy-mode aes256 cipher-mode

# ---- NTP / Syslog ----
ntp-service unicast-server 10.0.0.1
info-center loghost 10.0.0.200
