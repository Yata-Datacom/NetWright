# ============================================================
# NetForge 内置模板 — 管理面加固（SSH / AAA / SNMP / NTP / 日志） · 思科 IOS-XE/NX-OS
# 场景: 安全远程管理基线：本地账号+SSHv2、SNMPv3、NTP、Syslog、关闭不安全服务。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
! ---- AAA ----
username netadmin privilege 15 secret Net@Admin123
aaa new-model
aaa authentication login default local
aaa authorization exec default local

! ---- SSH v2 ----
ip domain-name corp.local
crypto key generate rsa modulus 2048
ip ssh version 2
ip ssh time-out 60
line vty 0 4
 transport input ssh
 login local
 exec-timeout 10 0

! ---- SNMP v3 ----
snmp-server group NMS-GRP v3 priv
snmp-server user netmon NMS-GRP v3 auth sha Mon@Key123 priv aes 128 Mon@Key123

! ---- NTP / Syslog ----
ntp server 10.0.0.1
logging host 10.0.0.200
service timestamps log datetime msec localtime
