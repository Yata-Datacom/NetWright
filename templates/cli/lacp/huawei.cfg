# ============================================================
# NetForge 内置模板 — 链路聚合 Eth-Trunk / LACP · 华为 VRP
# 场景: 多条物理链路捆绑为一个逻辑口，配 LACP 模式实现故障检测与负载分担。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- LACP 模式 Eth-Trunk ----
interface Eth-Trunk 1
 mode lacp-static
 port link-type trunk
 port trunk allow-pass vlan 10 20
 least active-linknumber 2
 max active-linknumber 8

# 加入成员口
interface GigabitEthernet0/0/1
 eth-trunk 1
interface GigabitEthernet0/0/2
 eth-trunk 1

# ---- 查看聚合状态 ----
# display eth-trunk 1
