# ============================================================
# NetForge 内置模板 — 链路聚合 Eth-Trunk / LACP · 思科 IOS-XE/NX-OS
# 场景: 多条物理链路捆绑为一个逻辑口，配 LACP 模式实现故障检测与负载分担。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
! ---- LACP EtherChannel ----
interface Port-channel1
 switchport trunk encapsulation dot1q
 switchport mode trunk
 switchport trunk allowed vlan 10,20

interface range GigabitEthernet0/1 - 2
 channel-group 1 mode active
 no shutdown
