# ============================================================
# NetForge 内置模板 — OSPF（多区域 / 默认路由下发 / 优化） · 思科 IOS-XE/NX-OS
# 场景: 骨干区 0 + 常规区划分，ABR 汇总，边界下发默认路由，接口开销与认证。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
interface Loopback0
 ip address 1.1.1.1 255.255.255.255

router ospf 1
 router-id 1.1.1.1
 default-information originate always
 network 10.0.0.0 0.0.0.3 area 0
 network 192.168.1.0 0.0.0.255 area 1
 area 1 stub
 area 1 range 192.168.0.0 255.255.0.0
 auto-cost reference-bandwidth 100000

interface GigabitEthernet0/0
 ip ospf cost 10
 ip ospf hello-interval 3
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 Huawei@123
