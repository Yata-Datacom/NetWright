# ============================================================
# NetForge 内置模板 — OSPF（多区域 / 默认路由下发 / 优化） · 新华三 Comware
# 场景: 骨干区 0 + 常规区划分，ABR 汇总，边界下发默认路由，接口开销与认证。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
ospf 1 router-id 1.1.1.1
 default-route-advertise always
 area 0.0.0.0
  network 10.0.0.0 0.0.0.3
 area 0.0.0.1
  network 192.168.1.0 0.0.0.255
  stub
  abr-summary 192.168.0.0 255.255.0.0

interface GigabitEthernet1/0/0
 ospf cost 10
 ospf timer hello 3
 ospf authentication-mode md5 1 cipher Huawei@123
