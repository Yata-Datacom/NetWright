# ============================================================
# NetForge 内置模板 — VyOS 基础路由（WAN+LAN+DHCP+NAT+防火墙）
# 场景：VyOS 1.4（circinus）set 语法；先 configure 进入配置模式
# 模板变量：
#   hostname        设备名
#   wan_cidr / lan_cidr        WAN/LAN 地址（含前缀）
#   lan_net         LAN 网段（DHCP 用）
#   dhcp_range      DHCP 范围起止，如 192.168.88.10-192.168.88.254
#   dns_server / ntp_server / syslog_server
#   admin_password  vyos 用户密码（建议作为项目凭据）
# ============================================================
#
configure
#
set system host-name '{{hostname}}'
set system ntp server {{ntp_server}}
set system syslog host {{syslog_server}} facility all level info
set system login user vyos authentication plaintext-password '{{admin_password}}'
#
# ---- 接口 ----
set interfaces ethernet eth0 description 'WAN'
set interfaces ethernet eth0 address '{{wan_cidr}}'
set interfaces ethernet eth1 description 'LAN'
set interfaces ethernet eth1 address '{{lan_cidr}}'
#
# ---- DHCP 服务 ----
set service dhcp-server shared-network-name LAN subnet {{lan_net}} option default-router '{{lan_cidr}}'
set service dhcp-server shared-network-name LAN subnet {{lan_net}} option name-server '{{dns_server}}'
set service dhcp-server shared-network-name LAN subnet {{lan_net}} range 0 start '{{dhcp_range}}'
set service dhcp-server shared-network-name LAN subnet {{lan_net}} range 0 stop '{{dhcp_range}}'
#
# ---- DNS 转发 ----
set service dns forwarding listen-address '{{lan_cidr}}'
set service dns forwarding allow-from '{{lan_net}}'
set service dns forwarding system
#
# ---- NAT 上网 ----
set nat source rule 100 outbound-interface name 'eth0'
set nat source rule 100 translation address 'masquerade'
#
# ---- WAN 防火墙（默认丢，放行 SSH/已建立）----
set firewall ipv4 name WAN_LOCAL default-action drop
set firewall ipv4 name WAN_LOCAL rule 10 action accept
set firewall ipv4 name WAN_LOCAL rule 10 state established enable
set firewall ipv4 name WAN_LOCAL rule 10 state related enable
set firewall ipv4 name WAN_LOCAL rule 20 action accept
set firewall ipv4 name WAN_LOCAL rule 20 destination port 22
set firewall ipv4 name WAN_LOCAL rule 20 protocol tcp
set interfaces ethernet eth0 firewall in name WAN_LOCAL
#
# ---- 服务 ----
set service ssh port 22
#
commit
save
exit
