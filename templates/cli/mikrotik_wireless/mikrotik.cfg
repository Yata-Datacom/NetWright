# ============================================================
# NetForge 内置模板 — MikroTik 无线 AP（RouterOS v7 wireless 包）
# 场景：AP 桥接模式：SSID + WPA2-PSK + 2.4G/5G 双频
# 注意：v7 新平台（802.11ax）使用 wifi-qcom 包，命令为 /interface wifi，
#       本模板为传统 wireless 包（ac 及以下）；命令随版本核对。
# 模板变量：
#   ssid            SSID
#   wifi_password   WPA2-PSK 密码（建议作为项目凭据）
#   bridge_name     上联网桥
# ============================================================
#
# ---- 安全模板 ----
/interface wireless security-profiles add name=sec-wpa2 \
 authentication-types=wpa2-psk,wpa2-eap mode=dynamic-keys \
 wpa2-pre-shared-key={{wifi_password}}
#
# ---- 2.4G 无线 ----
/interface wireless set [ find default-name=wlan1 ] \
 ssid={{ssid}} band=2ghz-b/g/n channel.frequency=2437 \
 security-profile=sec-wpa2 mode=ap-bridge disabled=no
#
# ---- 5G 无线（如有 wlan2）----
/interface wireless set [ find default-name=wlan2 ] \
 ssid={{ssid}}-5G band=5ghz-a/n/ac channel.frequency=5180 \
 security-profile=sec-wpa2 mode=ap-bridge disabled=no
#
# ---- 无线口入网桥 ----
/interface bridge port add bridge={{bridge_name}} interface=wlan1
/interface bridge port add bridge={{bridge_name}} interface=wlan2
#
# ---- 客户端隔离（可选）----
# /interface wireless set [ find ssid={{ssid}} ] station-bridge-mode... 
#
# ---- 查看 ----
# /interface wireless registration-table print
# /interface wireless print
#
return
