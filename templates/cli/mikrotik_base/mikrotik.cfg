# ============================================================
# NetForge 内置模板 — MikroTik RouterOS v7 基础路由（WAN+LAN+DHCP+NAT+防火墙）
# 场景：RouterOS v7 语法（/ 分层命令）；v6 个别命令有差异
# 模板变量：
#   hostname        设备名
#   lan_cidr        LAN 口地址（含前缀），如 192.168.88.1/24
#   wan_cidr        WAN 口地址（含前缀），如 203.0.113.2/30
#   dhcp_range      DHCP 地址池范围，如 192.168.88.10-192.168.88.254
#   lan_net         LAN 网段，如 192.168.88.0/24
#   dns_server      DNS 服务器
#   ntp_server      NTP 服务器
#   syslog_server   Syslog 服务器
#   admin_password  admin 密码（建议作为项目凭据）
# ============================================================
#
/system identity set name={{hostname}}
#
# ---- 接口分组 ----
/interface list add name=WAN
/interface list add name=LAN
/interface bridge add name=bridge-lan
/interface list member add interface=bridge-lan list=LAN
/interface list member add interface=ether1 list=WAN
#
# ---- LAN 地址与 DHCP ----
/ip address add address={{lan_cidr}} interface=bridge-lan
/ip pool add name=dhcp-lan ranges={{dhcp_range}}
/ip dhcp-server add address-pool=dhcp-lan interface=bridge-lan name=dhcp-lan disabled=no
/ip dhcp-server network add address={{lan_net}} gateway={{lan_cidr}} dns-server={{dns_server}}
#
# ---- WAN ----
/ip address add address={{wan_cidr}} interface=ether1
/ip dns set servers={{dns_server}} allow-remote-requests=yes
#
# ---- NAT 上网 ----
/ip firewall nat add chain=srcnat out-interface-list=WAN action=masquerade comment="LAN -> WAN"
#
# ---- 基础防火墙（放行已建立连接 + LAN 管理，丢弃 WAN 主动入站）----
/ip firewall filter add chain=input action=accept connection-state=established,related
/ip firewall filter add chain=input action=drop in-interface-list=WAN
/ip firewall filter add chain=input action=accept in-interface-list=LAN
#
# ---- 管理基线：仅留 SSH/Winbox，关闭 Telnet/WWW ----
/ip service set telnet disabled=yes
/ip service set www disabled=yes
/ip service set api disabled=yes
/ip service set ssh address={{lan_net}}
/user set admin password={{admin_password}}
#
# ---- NTP / Syslog ----
/system ntp client set enabled=yes servers={{ntp_server}}
/system logging action add name=to-syslog target=remote remote={{syslog_server}}
/system logging add topics=info action=to-syslog
/system logging add topics=error action=to-syslog
#
# ---- 查看 ----
# /system resource print
# /ip address print
# /ip firewall connection print
#
return
