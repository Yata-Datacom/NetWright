# ============================================================
# NetForge 内置模板 — BGP（eBGP 对等 / 引入直连 / 团体属性） · 思科 IOS-XE/NX-OS
# 场景: AS 间互联基础模板：建立 eBGP/iBGP 邻居，注入路由，常用属性控制。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
router bgp 65001
 bgp router-id 1.1.1.1
 neighbor 10.0.0.2 remote-as 65002
 neighbor 10.0.0.2 password Bgp@12345
 address-family ipv4
  network 192.168.0.0 mask 255.255.0.0
  neighbor 10.0.0.2 route-map SET-LOCALPREF in
  neighbor 10.0.0.2 activate

route-map SET-LOCALPREF permit 10
 set local-preference 200
