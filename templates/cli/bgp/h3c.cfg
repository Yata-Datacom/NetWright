# ============================================================
# NetForge 内置模板 — BGP（eBGP 对等 / 引入直连 / 团体属性） · 新华三 Comware
# 场景: AS 间互联基础模板：建立 eBGP/iBGP 邻居，注入路由，常用属性控制。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
bgp 65001
 router-id 1.1.1.1
 peer 10.0.0.2 as-number 65002
 peer 10.0.0.2 password cipher Bgp@12345
 address-family ipv4 unicast
  network 192.168.0.0 255.255.0.0
  import-route direct
  peer 10.0.0.2 route-policy SET-PREF import

route-policy SET-PREF permit node 10
 apply preference 200
