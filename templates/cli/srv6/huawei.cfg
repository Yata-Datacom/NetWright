# ============================================================
# NetForge 内置模板 — SRv6（华为 NE/CE，IS-IS SRv6）
# 场景：基于 IPv6 的 Segment Routing（无需 MPLS 数据面）：Locator + End SID，
#       由 IGP 扩散，供 VPN/TE 引用。命令随 VRP 版本差异较大，先在实验室验证。
# 模板变量：
#   ospf_router_id      Loopback0 地址（SRv6 End SID 源）
#   srv6_locator        SRv6 Locator 前缀，如 2001:DB8:AA::/64（需与其他节点不重叠）
#   prefix_sid          ISIS 节点号（NET 地址用）
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
# ============================================================
#
sysname {{hostname}}
#
ipv6
#
segment-routing ipv6
 locator LO1 prefix {{srv6_locator}} static 32      # 声明 Locator 段
#
# ---- IS-IS 扩散 SRv6 Locator ----
isis 1
 is-level level-2
 cost-style wide
 network-entity 49.0001.0000.0000.{{prefix_sid}}.00
 ipv6 enable topology standard
 segment-routing ipv6 locator LO1
#
interface LoopBack0
 ipv6 enable
 ipv6 address {{ospf_router_id}} 255.255.255.255
 isis ipv6 enable 1
#
interface GigabitEthernet0/0/0
 isis ipv6 enable 1
#
# ---- 服务侧引用（示例：L3VPN over SRv6，按需启用）----
# ip vpn-instance VPN-A
#  ipv6-family
#   route-distinguisher 100:1
# segment-routing ipv6
#  encapsulation source-address {{ospf_router_id}}
#
# ---- 查看 ----
# display segment-routing ipv6 locator
# display segment-routing ipv6 local-sid
# display isis ipv6 routing
#
return
