! ============================================================
! NetForge 内置模板 — SRv6（思科 IOS-XR，IS-IS SRv6）
! 场景：基于 IPv6 的 Segment Routing：Locator + End SID，由 IGP 扩散。
! 命令随 IOS-XR 版本（7.3+ 支持 SRv6）差异较大，先在实验室验证。
! 模板变量：
!   ospf_router_id      Loopback0 地址
!   srv6_locator        SRv6 Locator 前缀，如 2001:DB8:AA::/64
!   prefix_sid          ISIS 节点号（NET 地址用）
! 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
! ============================================================
!
hostname {{hostname}}
!
ipv6 unicast-routing
!
segment-routing
 srv6
  locators
   locator LO1
    prefix {{srv6_locator}}/64
   !
  !
 !
!
router isis 1
 is-type level-2-only
 net 49.0001.0000.0000.{{prefix_sid}}.00
 address-family ipv6 unicast
  metric-style wide
 !
 interface LoopBack0
  ipv6 enable
  address-family ipv6 unicast
   prefix-sid index 1
  !
 !
 interface GigabitEthernet0/0/0/0
  point-to-point
  address-family ipv6 unicast
  !
 !
!
! SRv6 locator 经 IS-IS 扩散后，End SID 自动生成
! ---- 查看 ----
! show segment-routing srv6 sid
! show isis segment-routing srv6 locators
!
end
