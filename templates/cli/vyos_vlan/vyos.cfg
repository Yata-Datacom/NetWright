# ============================================================
# NetForge 内置模板 — VyOS VLAN（网桥 + VIF 子接口）
# 场景：bridge 上按 VLAN 拆子接口（vif），每个 VIF 一个三层网关
# 模板变量：
#   vlan_ids        VLAN 列表，如 10,20
#   lan_cidr_10 / lan_cidr_20   各 VLAN 网关地址（示例固定两个，按需复制）
#   lan_net_10 / lan_net_20     各 VLAN 网段
# ============================================================
#
configure
#
# ---- VLAN 子接口（vif）----
set interfaces bridge br0 vif {{vlan_ids}} address '{{lan_cidr_10}}'
# 对每个 VLAN 复制（VyOS 配置树按 id 展开）：
# set interfaces bridge br0 vif 10 address '192.168.10.1/24'
# set interfaces bridge br0 vif 20 address '192.168.20.1/24'
#
# ---- 成员口（VLAN 感知桥）----
set interfaces bridge br0 member interface eth1
set interfaces bridge br0 member interface eth1 vlan 10
set interfaces bridge br0 member interface eth2
set interfaces bridge br0 member interface eth2 vlan 20
#
# ---- DHCP（按 VLAN）----
set service dhcp-server shared-network-name VLAN10 subnet {{lan_net_10}} option default-router '{{lan_cidr_10}}'
set service dhcp-server shared-network-name VLAN20 subnet {{lan_net_20}} option default-router '{{lan_cidr_20}}'
#
commit
save
exit
