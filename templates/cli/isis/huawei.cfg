# ============================================================
# NetForge 内置模板 — IS-IS（Level-1/2 / 广域网 IGP） · 华为 VRP
# 场景: 运营商常用 IGP：NET 地址规划、Level 分层、wide 开销、BFD 联动。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
isis 1
 is-level level-2
 cost-style wide
 network-entity 49.0001.0000.0000.0001.00
 bfd all-interfaces enable

# ---- 接口使能 ----
interface GigabitEthernet0/0/0
 isis enable 1
 isis cost 10

# ---- 引入外部路由 ----
isis 1
 import-route static level-2

# ---- 查看邻居/路由 ----
# display isis peer
# display isis route
