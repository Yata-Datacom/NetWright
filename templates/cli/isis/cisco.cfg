# ============================================================
# NetForge 内置模板 — IS-IS（Level-1/2 / 广域网 IGP） · 思科 IOS-XE/NX-OS
# 场景: 运营商常用 IGP：NET 地址规划、Level 分层、wide 开销、BFD 联动。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
 ip router isis

router isis
 net 49.0001.0000.0000.0001.00
 is-type level-2-only
 metric-style wide
 bfd all-interfaces
 passive-interface Loopback0

interface GigabitEthernet0/0
 ip router isis
 isis metric 10 level-2

router isis
 redistribute static level-2
