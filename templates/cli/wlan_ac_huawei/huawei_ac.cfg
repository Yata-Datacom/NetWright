# ============================================================
# NetForge 内置模板 — 无线 AC 开局（华为 AC6605/6508，V200R021 风格）
# 场景：Fit AP 经 CAPWAP 隧道上线 → 域/安全/SSID 模板 → VAP 下发
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
# 模板变量：
#   service_vlan    无线业务 VLAN
#   ssid            SSID
#   wifi_password   WPA2-PSK 密码（建议作为项目凭据）
#   ap_group        AP 组名（默认 group1）
# ============================================================
#
sysname {{hostname}}
#
vlan batch {{mgmt_vlan}} {{service_vlan}}
dhcp enable
#
# ---- AP 管理 VLANIF（CAPWAP 源接口）----
interface Vlanif {{mgmt_vlan}}
 ip address {{mgmt_ip}} {{mask}}
#
# ---- 无线业务 VLANIF（网关 + DHCP，可旁挂）----
interface Vlanif {{service_vlan}}
 ip address 192.168.{{service_vlan}}.1 255.255.255.0
 dhcp select interface
#
# ---- CAPWAP 隧道源 ----
capwap source interface vlanif {{mgmt_vlan}}
#
# ---- WLAN 模板体系 ----
wlan
 regulatory-domain-profile name rd-default
  country-code cn
 #
 security-profile name sec-wpa2
  security wpa2 psk pass-phrase {{wifi_password}} aes
 #
 ssid-profile name ssid-1
  ssid {{ssid}}
 #
 vap-profile name vap-1
  forward-mode tunnel
  service-vlan vlan-id {{service_vlan}}
  ssid-profile ssid-1
  security-profile sec-wpa2
 #
 ap-group name {{ap_group}}
  regulatory-domain-profile rd-default
  vap-profile vap-1 wlan 1 radio all
 #
 # ---- AP 上线：MAC 认证（把现场 AP 的 MAC 逐一登记）----
 ap auth-mode mac-auth
 ap-id 0 ap-mac xxxx-xxxx-xxxx
  ap-group {{ap_group}}
#
# ---- 查看 ----
# display ap all
# display vap ssid {{ssid}}
# display station all
#
return
