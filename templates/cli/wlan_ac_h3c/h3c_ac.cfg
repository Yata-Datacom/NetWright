# ============================================================
# NetForge 内置模板 — 无线 AC 开局（新华三 WX 系列，Comware V7）
# 场景：AP 自动注册 + 服务模板（SSID）+ 无线客户端 VLAN
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
# 模板变量：
#   service_vlan / ssid / wifi_password / ap_group
# ============================================================
#
sysname {{hostname}}
#
vlan {{mgmt_vlan}}
vlan {{service_vlan}}
#
# ---- CAPWAP 隧道源 ----
wlan capwap source vlan {{mgmt_vlan}}
#
# ---- 无线服务模板（SSID）----
wlan service-template 1
 ssid {{ssid}}
 akm mode psk
 psk pass-phrase {{wifi_password}}
 cipher-suite ccmp
 client vlan {{service_vlan}}
 service-template enable
#
# ---- AP 组与型号适配 ----
wlan ap-group {{ap_group}}
 ap-model WA6320
  radio 1
   type dot11ax
   radio enable
   service-template 1
  radio 2
   type dot11ax
   radio enable
   service-template 1
#
# ---- AP 手工上线（serial-id 按现场填写）----
wlan ap ap-1 model WA6320
 serial-id 219801A0CNC123456789
 ap-group {{ap_group}}
#
# ---- 查看 ----
# display wlan ap all
# display wlan service-template
# display wlan client
#
return
