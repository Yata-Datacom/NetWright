# ============================================================
# NetForge 内置模板 — VyOS 动态路由（OSPF + BGP）
# 场景：VyOS FRR 之上的 OSPF 区域与 eBGP 邻居
# 模板变量：
#   router_id       Router-ID
#   ospf_area       OSPF 区域
#   local_as        本端 AS
#   neighbor_ip / remote_as     BGP 邻居
# ============================================================
#
configure
#
# ---- OSPF ----
set protocols ospf parameters router-id {{router_id}}
set protocols ospf area {{ospf_area}} network '192.168.0.0/16'
set interfaces ethernet eth1 ip ospf area {{ospf_area}}
#
# ---- BGP（eBGP 邻居 + IPv4 地址族）----
set protocols bgp system-as {{local_as}}
set protocols bgp parameters router-id {{router_id}}
set protocols bgp neighbor {{neighbor_ip}} remote-as {{remote_as}}
set protocols bgp address-family ipv4-unicast network '192.168.0.0/16'
set protocols bgp neighbor {{neighbor_ip}} address-family ipv4-unicast soft-reconfiguration inbound
#
# ---- 查看 ----
# show ip ospf neighbor
# show bgp ipv4 summary
# show ip route bgp
#
commit
save
exit
