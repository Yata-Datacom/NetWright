# ============================================================
# NetForge 内置模板 — NAT（上网动态 NAT / 静态映射 / 服务器发布） · 华为 VRP
# 场景: 出口上网 easy-IP 复用公网地址、静态一对一映射、对外发布内网服务器。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- 感兴趣流（内网网段）----
acl 2000
 rule 5 permit source 192.168.0.0 0.0.255.255

# ---- 出口 easy-IP（复用接口公网地址）----
interface GigabitEthernet0/0/0        # 公网口
 nat outbound 2000

# ---- 服务器发布（外网 80 -> 内网 Web）----
interface GigabitEthernet0/0/0
 nat server protocol tcp global current-interface www inside 192.168.10.88 www

# ---- 静态一对一映射 ----
# interface GigabitEthernet0/0/0
#  nat static global 1.1.1.10 inside 192.168.10.20

# ---- 查看会话 ----
# display nat session all
