# ============================================================
# NetForge 内置模板 — NAT（上网动态 NAT / 静态映射 / 服务器发布） · 新华三 Comware
# 场景: 出口上网 easy-IP 复用公网地址、静态一对一映射、对外发布内网服务器。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
acl basic 2000
 rule 5 permit source 192.168.0.0 0.0.255.255

# ---- 出口 PAT ----
interface GigabitEthernet1/0/0
 nat outbound 2000

# ---- 服务器发布 ----
interface GigabitEthernet1/0/0
 nat server protocol tcp global 1.1.1.10 www inside 192.168.10.88 www

# ---- 静态映射 ----
# interface GigabitEthernet1/0/0
#  nat static enable
# nat static outbound 192.168.10.20 1.1.1.10
