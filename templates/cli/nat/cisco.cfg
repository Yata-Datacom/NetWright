# ============================================================
# NetForge 内置模板 — NAT（上网动态 NAT / 静态映射 / 服务器发布） · 思科 IOS-XE/NX-OS
# 场景: 出口上网 easy-IP 复用公网地址、静态一对一映射、对外发布内网服务器。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
! ---- 定义内网 ACL ----
ip access-list standard NAT-LAN
 permit 192.168.0.0 0.0.255.255

! ---- 接口角色 ----
interface GigabitEthernet0/1
 ip nat inside
interface GigabitEthernet0/0
 ip nat outside

! ---- PAT 上网（复用出接口）----
ip nat inside source list NAT-LAN interface GigabitEthernet0/0 overload

! ---- 服务器发布 ----
ip nat inside source static tcp 192.168.10.88 80 interface GigabitEthernet0/0 80

! ---- 静态一对一 ----
! ip nat inside source static 192.168.10.20 1.1.1.10

! ---- 查看 ----
! show ip nat translations
