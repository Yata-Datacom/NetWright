# ============================================================
# NetForge 内置模板 — IPv6 隧道（华为 VRP）：手工 GRE 隧道 + 6to4
# 场景：IPv6 孤岛穿越 IPv4 骨干
#   ① 手工隧道（GRE）：点对点，最可控，适合固定两站点
#   ② 6to4：按 2002::/16 从 IPv4 地址自动推导前缀，适合临时过渡
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
# 模板变量：
#   wan_ip / wan_peer        本端与对端公网 IPv4
#   tunnel_v6_local / tunnel_v6_peer   隧道两端 IPv6 地址（/64）
#   lan_v6_prefix            本站 IPv6 业务前缀
# ============================================================
#
sysname {{hostname}}
#
ipv6
#
# ---- ① 手工 GRE 隧道 ----
interface Tunnel0/0/0
 ip address 172.16.0.1 255.255.255.252      # 隧道 IPv4 编址（可选，便于探测）
 ipv6 enable
 ipv6 address {{tunnel_v6_local}}
 tunnel-protocol gre
 source {{wan_ip}}
 destination {{wan_peer}}
#
# ---- ② 6to4 隧道（前缀 = 2002:{wan_ip 十六进制}::/48）----
interface Tunnel0/0/1
 ipv6 enable
 ipv6 address 2002::/64
 tunnel-protocol ipv6-ipv4 6to4
 source {{wan_ip}}
#
# ---- 路由：对端前缀指向手工隧道，6to4 前缀指向 6to4 隧道 ----
ipv6 route-static {{tunnel_v6_peer}} Tunnel0/0/0
ipv6 route-static 2002:: 16 Tunnel0/0/1
#
# ---- 隧道跑 OSPFv3（可选）----
ospfv3 1
 router-id {{mgmt_ip}}
#
interface Tunnel0/0/0
 ospfv3 1 area 0.0.0.0
#
return
