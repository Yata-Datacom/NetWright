! ============================================================
! NetForge 内置模板 — IPv6 隧道（思科 IOS-XE）：手工 GRE + 6to4
! 场景：IPv6 孤岛穿越 IPv4 骨干
! 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
! 模板变量：
!   wan_ip / wan_peer / tunnel_v6_local / tunnel_v6_peer / lan_v6_prefix
! ============================================================
!
hostname {{hostname}}
!
ipv6 unicast-routing
!
! ---- ① 手工 GRE 隧道（双栈）----
interface Tunnel0
 ip address 172.16.0.1 255.255.255.252
 ipv6 enable
 ipv6 address {{tunnel_v6_local}}
 tunnel source GigabitEthernet0/0            ! 改为公网口
 tunnel destination {{wan_peer}}
 no shutdown
!
! ---- ② 6to4 隧道（前缀 = 2002:{wan_ip hex}::/48）----
interface Tunnel1
 no ip address
 ipv6 enable
 ipv6 address 2002::/64
 tunnel source GigabitEthernet0/0
 tunnel mode ipv6ip 6to4
 no shutdown
!
ipv6 route {{tunnel_v6_peer}}/64 Tunnel0
ipv6 route 2002::/16 Tunnel1
!
! ---- 隧道跑 OSPFv3（可选）----
ipv6 router ospf 1
 router-id {{mgmt_ip}}
!
interface Tunnel0
 ipv6 ospf 1 area 0
!
end
