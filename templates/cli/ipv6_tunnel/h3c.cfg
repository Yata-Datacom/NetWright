# ============================================================
# NetForge 内置模板 — IPv6 隧道（新华三 Comware V7）
# 场景：IPv6 孤岛穿越 IPv4 骨干：手工隧道 + 6to4
# 标准变量：hostname / mgmt_vlan / mgmt_ip / mask / gateway
# 模板变量：
#   wan_ip / wan_peer / tunnel_v6_local / tunnel_v6_peer / lan_v6_prefix
# ============================================================
#
sysname {{hostname}}
#
ipv6
#
# ---- 手工隧道 ----
interface Tunnel0 mode gre
 ip address 172.16.0.1 255.255.255.252
 ipv6 enable
 ipv6 address {{tunnel_v6_local}}
 source {{wan_ip}}
 destination {{wan_peer}}
#
# ---- 6to4 隧道 ----
interface Tunnel1 mode ipv6-ipv4 6to4
 ipv6 enable
 ipv6 address 2002::/64
 source {{wan_ip}}
#
ipv6 route-static {{tunnel_v6_peer}} Tunnel0
ipv6 route-static 2002:: 16 Tunnel1
#
ospf 1 router-id {{mgmt_ip}}
#
return
