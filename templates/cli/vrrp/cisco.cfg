# ============================================================
# NetForge 内置模板 — VRRP 网关主备 / 双活分担 · 思科 IOS-XE/NX-OS
# 场景: 两台网关互为主备；双组 VRRP 交叉承担 VLAN 实现负载分担，联动上行口状态。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
interface Vlan10
 ip address 192.168.10.2 255.255.255.0
 vrrp 10 ip 192.168.10.1
 vrrp 10 priority 120
 vrrp 10 preempt delay minimum 20
 vrrp 10 track 1 decrement 30

interface Vlan20
 ip address 192.168.20.2 255.255.255.0
 vrrp 20 ip 192.168.20.1
 vrrp 20 priority 90

! track 对象：上联口 down 时优先级降 30
track 1 interface GigabitEthernet0/24 line-protocol
