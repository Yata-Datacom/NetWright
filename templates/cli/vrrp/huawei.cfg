# ============================================================
# NetForge 内置模板 — VRRP 网关主备 / 双活分担 · 华为 VRP
# 场景: 两台网关互为主备；双组 VRRP 交叉承担 VLAN 实现负载分担，联动上行口状态。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- 核心 A：VLAN10 主 / VLAN20 备 ----
interface Vlanif10
 ip address 192.168.10.2 255.255.255.0
 vrrp vrid 10 virtual-ip 192.168.10.1
 vrrp vrid 10 priority 120
 vrrp vrid 10 preempt-mode timer delay 20
 vrrp vrid 10 track interface GigabitEthernet0/0/24 reduced 30

interface Vlanif20
 ip address 192.168.20.2 255.255.255.0
 vrrp vrid 20 virtual-ip 192.168.20.1
 vrrp vrid 20 priority 90

# 核心 B 相反：vrid 20 priority 120，vrid 10 priority 90
