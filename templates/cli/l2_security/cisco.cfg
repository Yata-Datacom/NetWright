# ============================================================
# NetForge 内置模板 — 二层安全（端口安全 / DHCP Snooping / ARP 检测 / 802.1X / 风暴抑制） · 思科 IOS-XE/NX-OS
# 场景: 接入层安全基线：MAC 端口安全、防私接 DHCP 服务器、防 ARP 欺骗、风暴抑制、环路检测、802.1X。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
! ---- 端口安全 ----
interface GigabitEthernet0/1
 switchport mode access
 switchport port-security
 switchport port-security maximum 4
 switchport port-security violation restrict
 switchport port-security mac-address sticky

! ---- DHCP Snooping ----
ip dhcp snooping
ip dhcp snooping vlan 10
interface GigabitEthernet0/24
 ip dhcp snooping trust

! ---- ARP 检测（DAI）----
ip arp inspection vlan 10
interface GigabitEthernet0/24
 ip arp inspection trust

! ---- 风暴抑制 ----
interface GigabitEthernet0/1
 storm-control broadcast level 10.00

! ---- 环路检测 ----
! Catalyst 用 loop guard / UDLD
interface GigabitEthernet0/1
 spanning-tree loopguard default
 udld enable

! ---- 802.1X ----
! authentication port-control auto
! dot1x pae authenticator
