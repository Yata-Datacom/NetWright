# ============================================================
# NetForge 内置模板 — 二层安全（端口安全 / DHCP Snooping / ARP 检测 / 802.1X / 风暴抑制） · 新华三 Comware
# 场景: 接入层安全基线：MAC 端口安全、防私接 DHCP 服务器、防 ARP 欺骗、风暴抑制、环路检测、802.1X。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- 端口安全 ----
interface GigabitEthernet1/0/1
 port-security max-mac-count 4
 port-security port-mode secure
 mac-address sticky

# ---- DHCP Snooping ----
dhcp snooping enable
interface GigabitEthernet1/0/24
 dhcp snooping trust

# ---- ARP 检测 ----
arp detection enable
interface GigabitEthernet1/0/1
 arp detection trust

# ---- 风暴抑制与环路检测 ----
interface GigabitEthernet1/0/1
 broadcast-suppression pps 5000
 loopback-detection enable

# ---- 802.1X ----
# dot1x
# interface GigabitEthernet1/0/1
#  dot1x
