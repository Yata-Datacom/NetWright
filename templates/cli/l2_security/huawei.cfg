# ============================================================
# NetForge 内置模板 — 二层安全（端口安全 / DHCP Snooping / ARP 检测 / 802.1X / 风暴抑制） · 华为 VRP
# 场景: 接入层安全基线：MAC 端口安全、防私接 DHCP 服务器、防 ARP 欺骗、风暴抑制、环路检测、802.1X。
# 模板变量（除标准字段外）: （见模板内注释）
# 标准变量 hostname/mgmt_vlan/mgmt_ip/mask/gateway/access_vlan/vlan_batch 视模板使用情况填写
# ============================================================
# ---- 端口安全（限制 MAC 数并粘滞）----
interface GigabitEthernet0/0/1
 port-security enable
 port-security max-mac-num 4
 port-security protect-action restrict
 port-security mac-address sticky

# ---- DHCP Snooping（防私接 DHCP 服务器）----
dhcp snooping enable
interface GigabitEthernet0/0/24       # 上联合法 DHCP 方向
 dhcp snooping trusted

# ---- ARP 检测（结合 snooping 绑定表）----
arp anti-attack check user-bind enable
interface GigabitEthernet0/0/1
 arp anti-attack check user-bind alarm enable

# ---- 风暴抑制与环路检测 ----
interface GigabitEthernet0/0/1
 broadcast-suppression 10             # 广播流量占比阈值 %
 loopback-detection enable

# ---- 802.1X（需 AAA 配合）----
# dot1x enable
# interface GigabitEthernet0/0/1
#  dot1x enable
